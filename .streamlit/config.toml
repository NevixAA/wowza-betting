# Wowza dashboard theme (visual redesign 2026-10-25).
# Mirrors dashboard_ui.DARK / dashboard_ui.LIGHT - tests/test_design_system.py fails if they drift.
# Dark is the default; [theme.light] keeps the app readable for a viewer who switches.
# The named colours (green/red/orange/violet/blue/gray) are what st.badge and :colour[text] use, so
# setting them here is how the semantic tokens reach Streamlit's native elements.

[theme]
base = "dark"
font = "sans-serif"
baseRadius = "medium"
showWidgetBorder = true
chartCategoricalColors = ["#4C8DF6", "#E2A93B", "#A47EF2", "#2BB59B", "#E86A3F", "#7C8A9A"]

[theme.dark]
primaryColor = "#4C8DF6"
backgroundColor = "#0B1016"
secondaryBackgroundColor = "#131A23"
textColor = "#E7EDF4"
borderColor = "#243040"
dataframeBorderColor = "#243040"
greenColor = "#2BB59B"
redColor = "#E86A3F"
orangeColor = "#E2A93B"
violetColor = "#A47EF2"
blueColor = "#4C8DF6"
grayColor = "#7C8A9A"

[theme.light]
primaryColor = "#1E6FD9"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#0F172A"
borderColor = "#DCE3EC"
dataframeBorderColor = "#DCE3EC"
greenColor = "#0E8A74"
redColor = "#C8461C"
orangeColor = "#B26B00"
violetColor = "#6D3FD1"
blueColor = "#1E6FD9"
grayColor = "#64748B"
