name: V11 Shadow

# SILENT, READ-ONLY market-first shadow logger. Runs the V11 engine beside frozen v9 and
# records what it WOULD decide, so v11 can be compared to v9's live results after the season.
# It sends NO Telegram, stakes nothing, and writes ONLY output/v11_shadow_log.csv. It cannot
# affect any live tip/model/stake. (No TELEGRAM secrets are even passed to this job.)

on:
  schedule:
    - cron: '20,50 8-23 * * *'   # twice/hour during match hours, offset from predict (:01)
  workflow_dispatch:

concurrency:
  group: v11-shadow
  cancel-in-progress: false

jobs:
  v11_shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: pip install pandas numpy

      - name: Run V11 shadow (read-only, no Telegram)
        run: python scripts/v11_shadow.py

      - name: Commit shadow log only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/v11_shadow_log.csv 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: v11 shadow $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
