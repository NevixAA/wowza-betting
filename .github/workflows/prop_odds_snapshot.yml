name: Prop Odds Snapshot

# Dense, ALWAYS-ON open->shifting->closing capture for player props (tracking only, no money).
# Decoupled from the heavy hourly predict so odds are logged even if predict skips/fails, and
# captured from market-open (not just match day). Cheap: reuses odds_fetcher's 2h per-event
# cache, so runs mostly hit cache. Appends distinct prices to player_prop_odds_history.csv +
# closes out CLV. ISOLATION: props-only; never touches the standard model or team pipeline.

concurrency:
  group: prop-odds-snapshot
  cancel-in-progress: false

on:
  schedule:
    # 12/day -> 6/day on 2026-08-30. Near-free in API terms, but NOT free in scheduling terms:
    # every scheduled run competes for the same throttled budget as predict and the odds captures,
    # and this one feeds the permanently-paper props product (root invariant 2). Delivered 3.3/day
    # against 12 requested; at 6 requested it should deliver most of them.
    - cron: '20 */4 * * *'   # every 4 hours (still within the odds-fetch cache TTL -> near-free)
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache prop-odds event cache (keeps the 2h TTL warm across runs)
        uses: actions/cache@v4
        with:
          path: prop_odds_cache
          key: prop-odds-cache-${{ github.run_id }}
          restore-keys: prop-odds-cache-

      - name: Snapshot upcoming prop odds + close out CLV
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # OUTPUT CAPTURED, INCLUDING STDERR. This step failed on 2026-09-05 04:36 after five
          # clean runs and the cause could not be read from outside: the script has two broad
          # `except` blocks and the workflow published nothing, so a failure said only that it
          # had failed. The identical blindness cost four wrong diagnoses on pro_team_stats
          # before the traceback was finally captured and named the real cause in one line.
          # `2>&1` is the whole point — a traceback goes to stderr; and pipefail because a pipe
          # to tee otherwise reports TEE's exit code and a crash would read as success.
          set -o pipefail
          python scripts/snapshot_prop_odds.py 2>&1 | tee snap.txt

      - name: Publish the snapshot output
        if: always()
        run: |
          {
            echo "## Prop odds snapshot"
            echo ""
            echo '```'
            tail -n 40 snap.txt 2>/dev/null || echo "(no output captured — it failed before printing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push odds history + CLV records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/player_prop_odds_history.csv output/clv_records.csv \
                     output/prop_odds_coverage.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: prop odds snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
