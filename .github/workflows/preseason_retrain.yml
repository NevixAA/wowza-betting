name: Pre-season Retrain

# Fires August 1st every year — one week before European leagues kick off.
# Full collect + retrain + backtest for both main models and player props.
# Also triggerable manually at any time (e.g. mid-season if data drifts).

on:
  schedule:
    - cron: '0 2 1 8 *'   # August 1st at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  preseason:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: collect fresh match data (football-data.co.uk) ───────────────
      - name: Download latest match data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python pipeline.py --mode collect
        continue-on-error: true

      # ── Step 2: collect fresh player stats (API-Football) ─────────────────────
      - name: Collect player stats (full history refresh)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode collect
        continue-on-error: true

      # ── Step 3: train all main models ─────────────────────────────────────────
      - name: Train main models (standard + newformat + HT + side markets)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python pipeline.py --mode train

      # ── Step 4: train all player props models ─────────────────────────────────
      - name: Train player props models (7 markets)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode train

      # ── Step 5: full backtest → ROI config ────────────────────────────────────
      - name: Run side market backtest
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python pipeline.py --mode backtest
        continue-on-error: true

      - name: Generate league ROI config (approved leagues for alerts)
        run: |
          python - <<'EOF'
          import json, pandas as pd
          from pathlib import Path

          roi = {}
          for market, f in [
              ("btts",   "output/backtest_by_league_btts.csv"),
              ("over15", "output/backtest_by_league_over15.csv"),
              ("over35", "output/backtest_by_league_over35.csv"),
          ]:
              p = Path(f)
              if not p.exists():
                  continue
              df = pd.read_csv(p)
              for _, row in df.iterrows():
                  league = row["league"]
                  roi.setdefault(league, {})[market] = round(float(row["roi_%"]), 2)

          THRESHOLDS = {"btts": 5.0, "over15": 3.0, "over35": 8.0}
          approved = {}
          for league, markets in roi.items():
              approved[league] = {m: v for m, v in markets.items() if v >= THRESHOLDS.get(m, 5.0)}

          out = {"roi_by_league": roi, "approved_markets_by_league": approved}
          Path("output/league_roi_config.json").write_text(json.dumps(out, indent=2))
          approved_count = sum(1 for v in approved.values() if v)
          print(f"ROI config written: {len(roi)} leagues, {approved_count} approved")
          EOF
        continue-on-error: true

      # ── Step 6: player props calibration ──────────────────────────────────────
      - name: Player props calibration report
        run: |
          python - <<'EOF'
          import json, pandas as pd, numpy as np
          from pathlib import Path
          from player_model.model import load_model, predict_proba
          from player_model import config

          hist = Path("player_history.parquet")
          if not hist.exists():
              print("No player_history.parquet"); exit(0)

          df = pd.read_parquet(hist)
          df["date"] = pd.to_datetime(df["date"])
          df = df.sort_values("date").reset_index(drop=True)
          if len(df) < 500:
              print(f"Not enough data ({len(df)} rows)"); exit(0)

          cutoff_idx = int(len(df) * 0.80)
          cutoff_date = df.iloc[cutoff_idx]["date"]
          test = df.iloc[cutoff_idx:].copy()
          print(f"Calibration test split (last 20%): from {cutoff_date.date()}  ({len(test):,} rows)")

          results = {}
          for market in config.MARKETS:
              target_col = config.MARKET_TARGETS.get(market)
              if not target_col or target_col not in test.columns:
                  continue
              y = test[target_col]
              base_rate = float(y.mean())
              if base_rate < 0.001:
                  continue
              try:
                  payload = load_model(market)
                  probs = predict_proba(test, payload)
                  implied_odds = round(1.0 / (base_rate * 1.10), 2)
                  edge_mask = probs > (base_rate * 1.10 * 1.15)
                  bets = int(edge_mask.sum())
                  if bets == 0:
                      continue
                  wins = int(y[edge_mask].sum())
                  profit = wins * (implied_odds - 1) - (bets - wins)
                  roi = round(profit / bets * 100, 2)
                  results[market] = {"bets": bets, "wins": wins, "roi_%": roi,
                                     "base_rate_%": round(base_rate*100,1), "implied_odds": implied_odds}
                  print(f"  {market:<10} bets={bets:4d}  wins={wins:4d}  ROI={roi:+.1f}%")
              except Exception as e:
                  print(f"  {market}: {e}")

          Path("output/player_props_calibration.json").write_text(json.dumps(results, indent=2))
          EOF
        continue-on-error: true

      # ── Commit everything ──────────────────────────────────────────────────────
      - name: Commit pre-season reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            models/model_v9_standard.pkl models/model_v9_newformat.pkl \
            models/model_v9_btts.pkl models/model_v9_over15.pkl models/model_v9_over35.pkl \
            models/model_ht_over05.pkl models/model_ht_over15.pkl \
            models/model_player_goals.pkl models/model_player_goals2.pkl \
            models/model_player_assists.pkl \
            models/model_player_sot.pkl models/model_player_sot2.pkl \
            models/model_player_sot3.pkl models/model_player_cards.pkl \
            models/metrics_model_v9_standard.json models/metrics_model_v9_newformat.json \
            models/metrics_model_v9_btts.json models/metrics_model_v9_over15.json \
            models/metrics_model_v9_over35.json \
            models/metrics_model_ht_over05.json models/metrics_model_ht_over15.json \
            models/best_params_btts.json models/best_params_over15.json models/best_params_over35.json \
            models/feature_importances_btts.csv models/feature_importances_over15.csv \
            models/feature_importances_over35.csv \
            models/feature_importances_ht_over05.csv models/feature_importances_ht_over15.csv \
            output/backtest_by_league_btts.csv output/backtest_by_league_over15.csv \
            output/backtest_by_league_over35.csv \
            output/backtest_results_btts.csv output/backtest_results_over15.csv \
            output/backtest_results_over35.csv \
            output/league_roi_config.json \
            output/player_props_calibration.json \
            player_history.parquet \
            2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: pre-season retrain $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash -X ours origin main
          git push
