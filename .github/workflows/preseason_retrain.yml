name: Pre-season Retrain

# Fires August 1st every year — one week before European leagues kick off.
# Full match-data collect + retrain of the MAIN models. Also triggerable manually.
#
# SCOPE (2026-08-02): main models ONLY (standard + newformat + HT + side markets).
#   - Player props are owned by player_props.yml (cached, Sunday 05:00 + WC nightly).
#   - The full walk-forward backtest + league ROI config are owned by backtest_matrix.yml
#     (parallel, monthly on the 1st — same day as this).
# Doing props + backtest inline here (uncached, sequential) blew the 3h cap, so both were
# moved to their dedicated workflows. This job now finishes well inside the timeout.

on:
  schedule:
    - cron: '0 2 1 8 *'   # August 1st at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  preseason:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Step 1: collect fresh match data (football-data.co.uk) ───────────────
      - name: Download latest match data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python pipeline.py --mode collect
        continue-on-error: true

      # ── Step 2: train all main models ─────────────────────────────────────────
      - name: Train main models (standard + newformat + HT + side markets)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python pipeline.py --mode train

      # ── Commit pre-season main-model reset ──────────────────────────────────────
      - name: Commit pre-season reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            models/model_v9_standard.pkl models/model_v9_newformat.pkl \
            models/model_v9_btts.pkl models/model_v9_over15.pkl models/model_v9_over35.pkl \
            models/model_ht_over05.pkl models/model_ht_over15.pkl \
            models/metrics_model_v9_standard.json models/metrics_model_v9_newformat.json \
            models/metrics_model_v9_btts.json models/metrics_model_v9_over15.json \
            models/metrics_model_v9_over35.json \
            models/metrics_model_ht_over05.json models/metrics_model_ht_over15.json \
            models/best_params_btts.json models/best_params_over15.json models/best_params_over35.json \
            models/feature_importances_btts.csv models/feature_importances_over15.csv \
            models/feature_importances_over35.csv \
            models/feature_importances_ht_over05.csv models/feature_importances_ht_over15.csv \
            2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: pre-season main-model retrain $(date -u '+%Y-%m-%d')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
