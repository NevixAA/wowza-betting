name: Dashboard sync dispatch

# NevixAA/wowza-dashboard (the SLIM dashboard) copies its code from this repo's main with its own
# hourly sync_from_v9 workflow, driven by deploy/dashboard_manifest.json. This sends it the
# repository_dispatch event 'v9-main-updated' after a push to main that touches dashboard code, so the
# slim repo syncs straight away instead of within the hour (files dropped from the manifest, such as the
# pipeline-only modules, are deleted there by the same run).
#
# GITHUB_TOKEN cannot dispatch to another repository. The step needs the secret
# DASHBOARD_DISPATCH_TOKEN: a fine-grained token for NevixAA/wowza-dashboard with
# "Contents: read and write". Without it the step logs a notice and exits 0; the hourly sync still runs.

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'deploy/dashboard_manifest.json'
      - 'config/leagues.json'
      - '.streamlit/config.toml'
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository_dispatch v9-main-updated to wowza-dashboard
        env:
          DISPATCH_TOKEN: ${{ secrets.DASHBOARD_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::DASHBOARD_DISPATCH_TOKEN is not set - no dispatch sent; wowza-dashboard syncs on its hourly schedule"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/NevixAA/wowza-dashboard/dispatches \
            -d "{\"event_type\":\"v9-main-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}")
          echo "GitHub answered HTTP $code"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out
            exit 1
          fi
