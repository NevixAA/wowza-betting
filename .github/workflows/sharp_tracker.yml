name: Sharp Money Tracker

on:
  schedule:
    - cron: '0 8,10,12,14,16,18,20,22 * * *'  # every 2h
  workflow_dispatch:

jobs:
  sharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sharp tracker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/sharp_tracker.py

      - name: Run Telegram (sharp alerts)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_bot/notifier.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/sharp_tips.csv output/sharp_history.json output/sharp_ledger.csv \
                     telegram_bot/notified.json telegram_bot/live_notified.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: sharp $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash -X ours origin main
          git push
