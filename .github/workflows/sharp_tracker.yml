name: Sharp Money Tracker

on:
  schedule:
    - cron: '0 8,10,12,14,16,18,20,22 * * *'  # every 2h
  workflow_dispatch:

jobs:
  sharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sharp tracker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/sharp_tracker.py

      - name: Run Telegram (sharp alerts)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from telegram_bot.notifier import notify_sharp_strong
          s = notify_sharp_strong()
          print(f'Sharp alerts sent: {s}')
          "
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Per-file loop: `git add -f a b missing` validates all pathspecs first and stages
          # NOTHING if one is absent, and `|| true` hides it. That exact pattern silenced
          # player_props.yml for three days (see its comment). output/sharp_history.json is
          # now retired to .json.migrated, so it WILL be missing here.
          #
          # output/sharp_history/ is the month-partitioned replacement: settled fixtures never
          # change, so only the current month churns. The monolith was 12.7 MB rewritten 8x a
          # day (~91 MB/day of blobs, ~2,009 MB across 514 commits).
          for f in output/sharp_tips.csv output/sharp_ledger.csv \
                   telegram_bot/sharp_notified.json \
                   output/sharp_history.json output/sharp_history.json.migrated; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          git add -f output/sharp_history/ 2>/dev/null || echo "  (no sharp_history/ yet)"
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: sharp $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
