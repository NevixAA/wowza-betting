name: Backtest

on:
  # Monthly schedule REMOVED 2026-07-13 — the monthly backtest is now backtest_matrix.yml
  # (fast, parallel, backtest-only). This stays as a MANUAL fallback for a full train+backtest.
  workflow_dispatch:      # manual only — full train + sequential backtest (slow fallback)
    inputs:
      target:
        description: "Which model to backtest (newformat = NF only, NO retrain, standard untouched)"
        type: choice
        options: [all, standard, newformat]
        default: all

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300    # heavy walk-forward (was 90 — too low); GitHub cap is 6h
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train models first (CI needs fresh models)
        # Skipped for a new-format-only run — that uses the already-committed models so the
        # standard model is NOT retrained/touched. Scheduled + 'all'/'standard' runs train.
        if: ${{ github.event.inputs.target != 'newformat' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py --mode train

      - name: Run walk-forward backtest + generate league ROI config
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" = "standard" ] || [ "$TARGET" = "newformat" ]; then
            echo "Per-model backtest: --only $TARGET"
            python pipeline.py --mode backtest --only "$TARGET"
          else
            python pipeline.py --mode backtest
          fi
          python - <<'EOF'
          import json, pandas as pd
          from pathlib import Path

          roi = {}
          for market, f in [
              ("btts",   "output/backtest_by_league_btts.csv"),
              ("over15", "output/backtest_by_league_over15.csv"),
              ("over35", "output/backtest_by_league_over35.csv"),
          ]:
              p = Path(f)
              if not p.exists():
                  continue
              df = pd.read_csv(p)
              for _, row in df.iterrows():
                  league = row["league"]
                  roi.setdefault(league, {})[market] = round(float(row["roi_%"]), 2)

          # A league is "approved" for a market if ROI >= threshold
          THRESHOLDS = {"btts": 5.0, "over15": 3.0, "over35": 8.0}
          approved = {}
          for league, markets in roi.items():
              approved[league] = {
                  m: v for m, v in markets.items()
                  if v >= THRESHOLDS.get(m, 5.0)
              }

          out = {"roi_by_league": roi, "approved_markets_by_league": approved}
          Path("output/league_roi_config.json").write_text(json.dumps(out, indent=2))
          approved_count = sum(1 for v in approved.values() if v)
          print(f"ROI config: {len(roi)} leagues evaluated, {approved_count} approved for alerts")
          EOF

      - name: Commit and push backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/backtest_results_standard.csv \
                     output/backtest_by_league_standard.csv \
                     output/backtest_results_newformat.csv \
                     output/backtest_by_league_newformat.csv \
                     output/backtest_results.csv \
                     output/backtest_by_league_btts.csv output/backtest_by_league_over15.csv \
                     output/backtest_by_league_over35.csv \
                     output/backtest_results_btts.csv output/backtest_results_over15.csv \
                     output/backtest_results_over35.csv \
                     output/league_roi_config.json \
                     models/best_params_side_markets.json \
                     models/model_v9_standard.pkl models/model_v9_newformat.pkl \
                     models/model_ht_over05.pkl models/model_ht_over15.pkl \
                     models/metrics_model_v9_standard.json \
                     models/metrics_model_v9_newformat.json \
                     models/metrics_model_ht_over05.json \
                     models/metrics_model_ht_over15.json \
                     models/feature_importances_ht_over05.csv \
                     models/feature_importances_ht_over15.csv 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: backtest results $(date -u '+%Y-%m-%d')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
