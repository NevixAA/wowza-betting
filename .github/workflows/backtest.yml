name: Backtest

on:
  schedule:
    - cron: '0 3 1 * *'   # 1st of every month at 03:00 UTC
  workflow_dispatch:   # also manual trigger

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train models first (CI needs fresh models)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py --mode train

      - name: Run walk-forward backtest
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py --mode backtest

      - name: Commit and push backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/backtest_results_standard.csv \
                     output/backtest_by_league_standard.csv \
                     output/backtest_results_newformat.csv \
                     output/backtest_by_league_newformat.csv \
                     output/backtest_results.csv \
                     models/model_v9_standard.pkl models/model_v9_newformat.pkl \
                     models/model_ht_over05.pkl models/model_ht_over15.pkl \
                     models/metrics_model_v9_standard.json \
                     models/metrics_model_v9_newformat.json \
                     models/metrics_model_ht_over05.json \
                     models/metrics_model_ht_over15.json \
                     models/feature_importances_ht_over05.csv \
                     models/feature_importances_ht_over15.csv 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: backtest results $(date -u '+%Y-%m-%d')"
          git pull --rebase --autostash -X ours origin main
          git push
