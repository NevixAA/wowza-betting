name: Side models (corners / cards) - reproducible training, artifact only

# DISPATCH ONLY, ARTIFACT ONLY (owner 2026-11-24, data architecture map gap: "corners and cards have no training
# workflow"). Nothing here is scheduled, nothing is committed, nothing is installed: the job has read-only repo
# permissions and uploads one artifact. A new side model reaches models/side_models/ only by a separate,
# owner-approved commit (rule: retrain only when wired, parity 0). A scheduled refit stays OFF until the owner
# approves one.
#
#   mode=reproduce        re-trains from the git tree of the recorded data ref (config/side_models_recipe.json),
#                         with the recorded cut-off and trained_at stamp, and FAILS unless the result equals the
#                         committed models/side_models/ (byte parity with line endings normalised, and max |p diff|
#                         0 over every training fixture). This is the lineage proof of the served artifact.
#   mode=refit_candidate  trains on the dispatched ref's committed data with an optional `until` cut-off and
#                         reports the old-vs-new comparison (model_version, per-league n_fit, max |p diff|). A
#                         candidate is evidence for an owner decision, never an install.
#
# Library versions are pinned to the ones the recorded reproduction was proven with (byte parity depends on them).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'reproduce | refit_candidate'
        required: true
        default: 'reproduce'
        type: choice
        options: [reproduce, refit_candidate]
      until:
        description: 'refit_candidate: data cut-off YYYY-MM-DD (blank = every committed row)'
        required: false
        default: ''

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: side-models-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the recorded data ref (reproduce)
        if: inputs.mode == 'reproduce'
        run: |
          set -euo pipefail
          ref=$(python3 -c "import json; print(json.load(open('config/side_models_recipe.json'))['data_ref'])")
          git fetch --no-tags --depth 1 origin "$ref"
          git cat-file -e "${ref}^{commit}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (pinned to the reproduction's library versions)
        run: pip install pandas==3.1.0 numpy==2.4.6 scipy==1.17.1 pyarrow==26.0.0

      - name: Reproduce the served artifact from its recorded recipe
        if: inputs.mode == 'reproduce'
        run: |
          set -euo pipefail
          python -m src.side_models.reproduce --out "$RUNNER_TEMP/side_models_out" \
            --evidence "$RUNNER_TEMP/side_models_out/side_models_lineage_evidence.json"

      - name: Refit candidate on this ref's committed data (never installed)
        if: inputs.mode == 'refit_candidate'
        env:
          UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/side_models_out" --data-ref HEAD)
          if [ -n "$UNTIL" ]; then
            [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::until must be YYYY-MM-DD"; exit 1; }
            args+=(--until "$UNTIL")
          fi
          python -m src.side_models.reproduce "${args[@]}"

      - name: Summary
        if: always()
        run: |
          f="$RUNNER_TEMP/side_models_out/reproduction.json"
          [ -f "$f" ] || exit 0
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1])); c = r["comparison"]
          print(f"### Side models: {r['mode']}")
          print(f"- data_ref `{r['data_ref'][:9]}`, until `{r['until']}`, model_version `{r['model_version']}`")
          print(f"- committed model_version `{c['model_version_ref']}`")
          print(f"- inputs match recipe: {r['inputs_match_recipe']}; byte parity (EOL normalised): {c['byte_parity']}")
          print(f"- max |p diff| {c['probability']['max_abs_prob_diff']} over {c['probability']['probabilities']} probabilities")
          print("- NOT installed: artifact only (owner approval required)")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: side-models-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/side_models_out
          if-no-files-found: warn
          retention-days: 30
