name: New-Format Odds Capture

# FORWARD capture of new-format O/U + BTTS odds (v10 NF mission 1).
# Fixes the gap found 2026-07-09: newformat_odds_history.csv was backfill-only (no
# scheduled append) so it stopped at 2026-06-23 while summer NF leagues keep playing.
# This appends today's odds for upcoming NF fixtures daily -> ends the re-backfill treadmill.
# ISOLATION: writes ONLY output/newformat_odds_history.csv (new-format team odds). It does
# not train/predict any model and does not touch the standard model, props, or shared code.

concurrency:
  group: nf-odds-capture
  cancel-in-progress: false

on:
  schedule:
    # HOURLY during football hours, 3-hourly overnight (2026-08-19). Offset :30 from
    # std_odds_capture so the two never contend for the runner or the quota.
    #
    # New-format O/U 2.5 already rides on predict for free via newformat_odds_dense.csv; this
    # run is what gives BTTS and O/U 1.5/3.5 a real open->moving->close curve instead of the
    # ~1.2 snapshots/fixture it had. At 3-hourly spacing the T-1h / T-30m / T-10m horizons the
    # research plan asks for do not exist, and those are where the closing line forms.
    #
    # Funded from existing headroom: measured usage is ~10-11k/day against a 75,000 cap.
    # WIDE — all look-ahead fixtures, 4x/day, offset from std so the two never contend.
    - cron: '35 1,7,13,19 * * *'
    # NEAR — only fixtures within 12h, every 15 minutes, offset from std_odds_capture.
    # Cheap because few fixtures are ever imminent; this is what creates T-1h/T-30m/T-10m.
    # CUT 2026-08-29: every 15 min (96/day) -> hourly (24/day), same reasoning as
    # std_odds_capture. A scheduled NEAR run already samples internally for ~25 minutes, so four
    # firings an hour requested four overlapping loops; and with the repo asking 696 scheduled
    # runs a Saturday against ~4% delivery, this workflow received 3 runs in 12 hours. 24
    # requested that land beat 96 that are dropped.
    # ALIGNED TO THE KICKOFF CLOCK, 2026-09-02 — same reasoning as std_odds_capture, which
    # carries the full measurement. In short: 86.5% of the 594 fixtures in the canonical store
    # kick off at :00 (60.6%) or :30 (25.9%), so a capture's distance to the close is set by the
    # minute it fires. :47 sat at T-13m for the :00 group and T-43m for the :30 group.
    #
    # :20 and :50 put a capture inside T-10m for both groups. Still clear of std_odds_capture's
    # :23 and :52 by three minutes, so the two never contend for a runner, and both stay off :00
    # and :15 — GitHub's most contended minutes.
    #
    # 04:00-08:00 UTC used to be dropped as "zero kickoffs", but 7.3% of new-format kickoffs (Asian
    # leagues) fall at 04-09 UTC; owner 2026-10-26 added them back (all 24 hours now).
    - cron: '20,50 0-23 * * *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'Only price fixtures within N hours (blank = all/WIDE)'
        required: false
        default: ''
      loop_minutes:
        description: 'Base loop length in minutes before keep-alive applies (blank = 40)'
        required: false
        default: ''

jobs:
  nf_odds_capture:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES (25) plus checkout/pip/commit, or the timeout kills the
    # loop mid-window and the run commits nothing. Minutes are free on a public repo; the
    # concurrency group prevents a long run overlapping the next firing.
    # 40 -> 55: the loop base is now 40 minutes and checkout, pip and the commit add more.
    # A timeout below the loop length does not shorten the loop, it kills the run
    # mid-window and commits nothing.
    # 2026-10-22: CAP 170 (adaptive keep-alive) + checkout/pip/commit. A timeout below the cap
    # would kill the run mid-window and commit nothing.
    timeout-minutes: 195
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A queued scheduled run otherwise checks out the SHA of its SCHEDULE time, so it would
          # read a stale output/capture_wide state and could repeat a WIDE pass already done.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture forward new-format odds
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # PER-BOOKMAKER RETENTION, ON since 2026-10-04 -- same flag, same semantics and the
          # same zero quota cost as the standard capture: dropping the bookmaker filter makes
          # the SAME request return every book. The consensus archive below is unchanged,
          # because _parse_all_odds keeps Bet365 only regardless of what the payload carries.
          #
          # This track matters most. New-format main O/U is -16.12u over 30 days against
          # standard's +1.41u, and the odds>3.0 band holding 35.5% of the net loss is 100%
          # new_format. Any fix there will be argued from closing lines, and /odds is pre-match
          # only -- so the evidence has to exist before the question is asked.
          CAPTURE_BOOK_QUOTES: "1"
          # WIDE-pass guard (src/capture_schedule.wide_due). One WIDE pass prices every look-ahead
          # fixture: ~17+17x28 = ~490 calls (std) / ~15+15x20 = ~315 (nf). 4/day by the 6 h rule;
          # the call cap is a hard ceiling on what WIDE passes may spend per UTC day.
          CAPTURE_WIDE_EVERY_H: "6"
          CAPTURE_WIDE_MAX_PER_DAY: "4"
          CAPTURE_WIDE_MAX_CALLS_PER_DAY: "1500"
        run: |
          # NEAR on the 15-minute cron, WIDE on the 4x/day cron. One script, one flag.
          # ── NEAR vs WIDE: MATCH THE WIDE CRON, DEFAULT TO NEAR ─────────────────────────
          # Same bug as std_odds_capture.yml, which carries the full write-up. Short version:
          # the test was `schedule == '7-59/15 * * * *'`, that cron was replaced on 2026-08-29
          # and again on 2026-09-02, and the comparison string was never updated — so MH stayed
          # empty on every scheduled run and the NEAR loop below has been unreachable since.
          #
          # This one matters more than std's. New-format side markets already have the WORST
          # measured closing coverage in the store: btts_yes/no, over15 and under35 reach T-10m
          # on 17.6% of fixtures against 63.6% for the main market. The loop that was supposed to
          # fix that never ran, and the 2026-09-05 change raising LOOP_MIN from 25 to 40 was
          # tuning a branch nothing could reach.
          #
          # Inverted: match the WIDE cron, everything else scheduled is NEAR. Fails safe — editing
          # the wide cron thins the far horizon rather than deleting the close.
          MH="${{ github.event.inputs.max_hours }}"
          SCHED="${{ github.event.schedule }}"
          WIDE_CRON='35 1,7,13,19 * * *'
          if [ -z "$MH" ] && [ -n "$SCHED" ] && [ "$SCHED" != "$WIDE_CRON" ]; then
            MH=12
          fi
          if [ -n "$MH" ]; then
            echo "mode=NEAR (within ${MH}h)  schedule='${SCHED:-manual}'"
          else
            echo "mode=WIDE (all look-ahead fixtures)  schedule='${SCHED:-manual}'"
          fi

          # The NEAR run LOOPS — see std_odds_capture.yml for the measurement. Short version:
          # GitHub delivered this workflow's '*/15' cron every 174 minutes (21 runs in 2.3 days),
          # and queue wait was 0s, so the events are dropped by GitHub's shared scheduler rather
          # than delayed by busy runners. No plan changes it. Taking the density inside one run is
          # the only thing that works, and it is safe because the script keeps consecutive-distinct
          # prices only: a pass where nothing moved writes no row.
          # ── ADAPTIVE NEAR LOOP (P1 2026-10-22) ─────────────────────────────────────────────
          # Certified CLV needs an observation inside the final 30 minutes (shadow_settlement
          # CLOSE_MAX_MIN). Measured 2026-10-04..10-22: a capture RAN inside T-30m for only ~30% of
          # fixtures, because a delivered run (GitHub delivers ~8/day whatever the cron asks) lived
          # 40-50 minutes and then stopped. Two changes, both decided in src/capture_schedule.py:
          #   * KEEP-ALIVE: past BASE minutes the run keeps sampling while a kickoff it has seen is
          #     within KEEPALIVE minutes, never past CAP. Replayed on the measured run starts:
          #     T-30m "a capture ran" ~44% -> ~76% (new-format), ~34% -> ~90% (standard).
          #   * PER-FIXTURE DUE INTERVALS: each pass prices a fixture only when it is due (hourly
          #     beyond 6h, ~15 min at 1-6h, ~5 min at 30-60 min, EVERY pass inside 30 min), and
          #     passes tighten to 2 minutes when a kickoff is inside 35 minutes. That moves the
          #     API spend to where the close forms and is what pays for the longer runs.
          # The script prints LOOP_CONTINUE / LOOP_SLEEP_S; the loop just obeys. A pass that
          # prints nothing (crashed) falls back to "continue at 5 minutes while inside BASE".
          # A WIDE firing does its one wide pass first and then joins the same NEAR loop, so every
          # delivered run is used for the close.
          # The concurrency group holds one pending run: a firing that lands while this run is
          # alive waits and starts as soon as it ends, so a long run chains instead of overlapping.
          # Shadow settlement waits CLOSE_SETTLE_DELAY_MIN (240) after kickoff, longer than CAP plus
          # the commit, so a close captured by a long run is on main before the row is settled.
          export CAPTURE_STATE="${RUNNER_TEMP:-/tmp}/capture_state.json"
          export LOOP_START_S=$(date -u +%s)
          export LOOP_BASE_MIN="${{ github.event.inputs.loop_minutes }}"
          [ -n "$LOOP_BASE_MIN" ] || LOOP_BASE_MIN=40
          export LOOP_KEEPALIVE_MIN=90
          export LOOP_CAP_MIN=170
          rm -f "$CAPTURE_STATE"

          # ── WIDE PASSES FROM INSIDE THE LOOP (owner-approved 2026-10-26) ─────────────────────
          # The WIDE cron used to be the ONLY way a WIDE pass happened, and GitHub cannot hit a
          # clock: measured 2026-10-05..10-26, 3.2-3.3 WIDE passes/day were delivered against 4
          # requested, hours late and with 7-9 h gaps. The market-first engine refuses a far book
          # quote older than 12 h, so now EVERY pass of this loop first asks
          # `python -m src.capture_schedule wide-due`, which answers from a RECORDED timestamp in
          # the committed file below (never mtime; missing/corrupt = infinitely old = run now).
          # Due at >= CAPTURE_WIDE_EVERY_H hours; hard-capped per UTC day by pass count and by the
          # API calls WIDE passes spent; never inside the last 15 minutes before the loop cap.
          # The WIDE cron is now just one more firing that asks the same question. A manual run
          # with blank max_hours still forces one WIDE pass. If the check itself fails, the old
          # rule applies: one WIDE pass on the WIDE cron, none otherwise.
          export CAPTURE_WIDE_STATE="output/capture_wide/nf_capture.json"
          FORCE_WIDE=0
          WIDE_FALLBACK_DONE=0
          LAST_KO=""      # nearest kickoff (min) from the last NEAR pass: a WIDE pass waits while
                          # a close is forming (<=35 min), at most 2 h past due
          if [ -z "$MH" ]; then
            [ -n "$SCHED" ] || FORCE_WIDE=1
            MH=12
          fi
          wide_if_due() {
            if [ "$FORCE_WIDE" = "1" ]; then
              FORCE_WIDE=0
              WD="$(printf 'WIDE_DUE=1\nWIDE_REASON=MANUAL')"
            else
              WD=$(python -m src.capture_schedule wide-due --state "$CAPTURE_WIDE_STATE" \
                     --next-ko-min "$LAST_KO" 2>&1)
              if ! printf '%s\n' "$WD" | grep -q '^WIDE_DUE=[01]$'; then
                echo "  [wide] due check failed: $WD"
                if [ "$SCHED" = "$WIDE_CRON" ] && [ "$WIDE_FALLBACK_DONE" != "1" ]; then
                  WIDE_FALLBACK_DONE=1; WD="WIDE_DUE=1"
                else
                  WD="WIDE_DUE=0"
                fi
              fi
            fi
            printf '%s\n' "$WD" | sed 's/^/  [wide] /'
            if printf '%s\n' "$WD" | grep -q '^WIDE_DUE=1$'; then
              echo "WIDE pass: all fixtures in the look-ahead window"
              python scripts/capture_nf_odds_forward.py || echo "  (wide pass failed - continuing)"
            fi
          }

          echo "NEAR loop: fixtures within ${MH}h, base ${LOOP_BASE_MIN}m, keep-alive ${LOOP_KEEPALIVE_MIN}m, cap ${LOOP_CAP_MIN}m"
          i=0
          while : ; do
            i=$((i + 1))
            echo "--- pass $i  $(date -u '+%H:%M:%S') ---"
            wide_if_due
            OUT_TXT=$(python scripts/capture_nf_odds_forward.py --max-hours "$MH" 2>&1) || echo "  (pass $i failed - continuing)"
            echo "$OUT_TXT"
            LAST_KO=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^NEXT_KO_MIN=\([0-9][0-9]*\)$/\1/p' | tail -1)
            CONT=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^LOOP_CONTINUE=\([01]\)$/\1/p' | tail -1)
            SLEEP_S=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^LOOP_SLEEP_S=\([0-9][0-9]*\)$/\1/p' | tail -1)
            if [ -z "$CONT" ] || [ -z "$SLEEP_S" ]; then
              SLEEP_S=300
              ELAPSED=$(( $(date -u +%s) - LOOP_START_S + SLEEP_S ))
              if [ "$ELAPSED" -lt $(( LOOP_BASE_MIN * 60 )) ]; then CONT=1; else CONT=0; fi
            fi
            [ "$CONT" = "1" ] || break
            echo "  next pass in ${SLEEP_S}s"
            sleep "$SLEEP_S"
          done
          echo "completed $i passes over $(( ( $(date -u +%s) - LOOP_START_S ) / 60 ))m"

      - name: Commit and push updated NF odds history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/newformat_odds_history.csv 2>/dev/null || true
          # Stage the per-book quotes too. Omitting this is the 2026-08-15 failure shape:
          # every step green, the data captured, nothing persisted.
          git add -f output/book_quotes 2>/dev/null || true
          # Last-seen heartbeat (src/odds_heartbeat.py): this writer's own directory only.
          git add -f output/odds_heartbeat/nf_capture 2>/dev/null || true
          # Recorded WIDE-pass timestamp + per-day counters (src/capture_schedule.wide_due).
          git add -f output/capture_wide/nf_capture.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: nf odds capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # No `-X ours` — see std_odds_capture.yml. In a rebase `ours` is upstream, so it threw
            # away this run's own appended rows on every push race. merge=union in .gitattributes
            # keeps both sides.
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
# schedule re-registered after the 2026-10-26 history clean-up (comment only)
