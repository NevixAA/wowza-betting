name: New-Format Odds Capture

# FORWARD capture of new-format O/U + BTTS odds (v10 NF mission 1).
# Fixes the gap found 2026-07-09: newformat_odds_history.csv was backfill-only (no
# scheduled append) so it stopped at 2026-06-23 while summer NF leagues keep playing.
# This appends today's odds for upcoming NF fixtures daily -> ends the re-backfill treadmill.
# ISOLATION: writes ONLY output/newformat_odds_history.csv (new-format team odds). It does
# not train/predict any model and does not touch the standard model, props, or shared code.

concurrency:
  group: nf-odds-capture
  cancel-in-progress: false

on:
  schedule:
    # HOURLY during football hours, 3-hourly overnight (2026-08-19). Offset :30 from
    # std_odds_capture so the two never contend for the runner or the quota.
    #
    # New-format O/U 2.5 already rides on predict for free via newformat_odds_dense.csv; this
    # run is what gives BTTS and O/U 1.5/3.5 a real open->moving->close curve instead of the
    # ~1.2 snapshots/fixture it had. At 3-hourly spacing the T-1h / T-30m / T-10m horizons the
    # research plan asks for do not exist, and those are where the closing line forms.
    #
    # Funded from existing headroom: measured usage is ~10-11k/day against a 75,000 cap.
    # WIDE — all look-ahead fixtures, 4x/day, offset from std so the two never contend.
    - cron: '35 1,7,13,19 * * *'
    # NEAR — only fixtures within 12h, every 15 minutes, offset from std_odds_capture.
    # Cheap because few fixtures are ever imminent; this is what creates T-1h/T-30m/T-10m.
    # CUT 2026-08-29: every 15 min (96/day) -> hourly (24/day), same reasoning as
    # std_odds_capture. A scheduled NEAR run already samples internally for ~25 minutes, so four
    # firings an hour requested four overlapping loops; and with the repo asking 696 scheduled
    # runs a Saturday against ~4% delivery, this workflow received 3 runs in 12 hours. 24
    # requested that land beat 96 that are dropped.
    # ALIGNED TO THE KICKOFF CLOCK, 2026-09-02 — same reasoning as std_odds_capture, which
    # carries the full measurement. In short: 86.5% of the 594 fixtures in the canonical store
    # kick off at :00 (60.6%) or :30 (25.9%), so a capture's distance to the close is set by the
    # minute it fires. :47 sat at T-13m for the :00 group and T-43m for the :30 group.
    #
    # :20 and :50 put a capture inside T-10m for both groups. Still clear of std_odds_capture's
    # :23 and :52 by three minutes, so the two never contend for a runner, and both stay off :00
    # and :15 — GitHub's most contended minutes.
    #
    # Hours 04:00-08:00 UTC hold zero kickoffs in the store and are dropped, which pays for most
    # of the second slot. Net 24/day -> 36/day.
    - cron: '20,50 0-3,9-23 * * *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'Only price fixtures within N hours (blank = all/WIDE)'
        required: false
        default: ''
      loop_minutes:
        description: 'NEAR only: keep sampling for N minutes (blank = 25)'
        required: false
        default: ''
      loop_every:
        description: 'NEAR only: minutes between passes (blank = 5)'
        required: false
        default: ''

jobs:
  nf_odds_capture:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES (25) plus checkout/pip/commit, or the timeout kills the
    # loop mid-window and the run commits nothing. Minutes are free on a public repo; the
    # concurrency group prevents a long run overlapping the next firing.
    # 40 -> 55: the loop base is now 40 minutes and checkout, pip and the commit add more.
    # A timeout below the loop length does not shorten the loop, it kills the run
    # mid-window and commits nothing.
    timeout-minutes: 55
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture forward new-format odds
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # NEAR on the 15-minute cron, WIDE on the 4x/day cron. One script, one flag.
          MH="${{ github.event.inputs.max_hours }}"
          if [ -z "$MH" ] && [ "${{ github.event.schedule }}" = '7-59/15 * * * *' ]; then
            MH=12
          fi

          # The NEAR run LOOPS — see std_odds_capture.yml for the measurement. Short version:
          # GitHub delivered this workflow's '*/15' cron every 174 minutes (21 runs in 2.3 days),
          # and queue wait was 0s, so the events are dropped by GitHub's shared scheduler rather
          # than delayed by busy runners. No plan changes it. Taking the density inside one run is
          # the only thing that works, and it is safe because the script keeps consecutive-distinct
          # prices only: a pass where nothing moved writes no row.
          LOOP_MIN="${{ github.event.inputs.loop_minutes }}"
          LOOP_EVERY="${{ github.event.inputs.loop_every }}"
          # SIZED TO FIT THE DELIVERY INTERVAL (fixed 2026-08-19, second attempt).
          # The first version looped for 100 minutes. That was wrong: this workflow's concurrency
          # group only allows ONE pending run, so while a 100-120 minute loop held the group every
          # subsequent cron firing queued and was then CANCELLED by the firing after it. Measured:
          # 7 of 22 runs cancelled after sitting queued 15-44 minutes, and the successful loops ran
          # 99-122 minutes against a 120-minute timeout, i.e. no margin at all.
          # No data was lost - the long runs did commit - but most firings were wasted and the run
          # list looked broken.
          # 25 minutes at 5-minute spacing gives 5 passes, FINER near-kickoff resolution than the
          # old 10-minute spacing, and finishes well inside the ~30-45 minute real delivery gap so
          # runs stop piling up.
          # 25 -> 40 (2026-09-05), same arithmetic as std_odds_capture. Coverage of the final
          # ten minutes is delivery x loop length, and delivery is not ours to raise: this
          # workflow gets ~10 runs/day against ~28 requested (36%). Simulated at that rate,
          # P(landing inside T-10m) is 25% at a 25-minute loop and 34% at 40.
          #
          # The kickoff-aware EXTENSION that std_odds_capture now has is NOT applied here, and
          # deliberately not faked: it keys on a NEXT_KO_MIN line that only
          # capture_std_sidemarket_odds_forward.py prints. capture_nf_odds_forward.py emits no
          # such signal, so a run here cannot know whether a kickoff is imminent. Adding that
          # print is the follow-up; guessing a duration without it would just be a longer loop
          # wearing the word "adaptive".
          #
          # This matters most here: new-format side markets have the WORST measured closing
          # coverage of anything in the store — btts_yes/no, over15 and under35 reach T-10m on
          # 17.6% of fixtures against 63.6% for the main market.
          [ -n "$LOOP_MIN" ]   || LOOP_MIN=40
          [ -n "$LOOP_EVERY" ] || LOOP_EVERY=5

          if [ -z "$MH" ]; then
            echo "WIDE run: all fixtures in the look-ahead window (single pass)"
            python scripts/capture_nf_odds_forward.py
            exit 0
          fi

          echo "NEAR run: fixtures within ${MH}h, sampling every ${LOOP_EVERY}m for ${LOOP_MIN}m"
          START_S=$(date -u +%s)
          MAX_LOOP_MIN=${MAX_LOOP_MIN:-50}
          END=$(( START_S + LOOP_MIN * 60 ))
          i=0
          SLEEP_S=$(( LOOP_EVERY * 60 ))
          while : ; do
            i=$((i + 1))
            echo "--- pass $i  $(date -u '+%H:%M:%S')  (next gap ${SLEEP_S}s) ---"
            OUT_TXT=$(python scripts/capture_nf_odds_forward.py --max-hours "$MH" 2>&1) || echo "  (pass $i failed - continuing)"
            echo "$OUT_TXT"
            # capture_nf_odds_forward.py now prints NEXT_KO_MIN, so this loop can behave like
            # std_odds_capture instead of running blind for a fixed length. Reading it costs
            # nothing: the pass already computed the value to filter its own window.
            KO_MIN=$(printf '%s\n' "$OUT_TXT" | grep -o 'NEXT_KO_MIN=[0-9][0-9]*' | head -1 | cut -d= -f2)
            if [ -n "$KO_MIN" ]; then
              # Tighten spacing as kickoff nears: the close is where the curve is thin. New-format
              # side markets reach T-10m on 17.6% of fixtures against 63.6% for the main market.
              if   [ "$KO_MIN" -le 20 ]; then SLEEP_S=120
              elif [ "$KO_MIN" -le 45 ]; then SLEEP_S=180
              else                            SLEEP_S=$(( LOOP_EVERY * 60 ))
              fi
              echo "  nearest kickoff ${KO_MIN}m away -> next pass in ${SLEEP_S}s"
            fi
            NEXT=$(( $(date -u +%s) + SLEEP_S ))
            # Stay alive for a kickoff falling just past the base window — the case that made a
            # run landing at T-40m stop at T-15m and miss the close entirely. Never past
            # MAX_LOOP_MIN, because a loop still running when the next firing arrives cancels it.
            if [ -n "$KO_MIN" ] && [ "$NEXT" -ge "$END" ]; then
              NOW_S=$(date -u +%s)
              WANT_END=$(( NOW_S + KO_MIN * 60 + 120 ))
              HARD_END=$(( START_S + MAX_LOOP_MIN * 60 ))
              if [ "$WANT_END" -gt "$END" ] && [ "$WANT_END" -le "$HARD_END" ]; then
                END=$WANT_END
                echo "  extending loop to cover a kickoff ${KO_MIN}m away (cap ${MAX_LOOP_MIN}m)"
              fi
            fi
            NEXT=$(( $(date -u +%s) + SLEEP_S ))
            [ "$NEXT" -lt "$END" ] || break
            sleep "$SLEEP_S"
          done
          echo "completed $i passes over $(( ( $(date -u +%s) - START_S ) / 60 ))m"

      - name: Commit and push updated NF odds history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/newformat_odds_history.csv 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: nf odds capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # No `-X ours` — see std_odds_capture.yml. In a rebase `ours` is upstream, so it threw
            # away this run's own appended rows on every push race. merge=union in .gitattributes
            # keeps both sides.
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
