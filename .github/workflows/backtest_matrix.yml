name: Backtest (per-model, parallel)

# v10 UPGRADE (staged): run each model's backtest as its own PARALLEL job instead of the slow
# sequential "all". The models are independent, so wall-clock = slowest single model (~20-40min)
# instead of the sum (hours). Backtest-only (NO --mode train — walk-forward retrains per window
# internally, so the upfront full retrain was pure waste). Each job uploads its result CSVs and its
# threshold CANDIDATE as artifacts; a final aggregate job writes ONE threshold PROPOSAL and commits it
# with the backtest evidence in ONE commit (no 5-way push race).
#
# PROPOSE, NEVER APPLY (owner rule 2026-10-26). Until then this workflow rewrote
# models/best_params_standard.json / best_params_side_markets.json, and production served every
# league the optimiser itself marked `approved` - a live threshold change with no human in the loop.
# Now it writes output/threshold_proposals/<YYYY-MM>.json + .md (+ latest.json) and NOTHING that
# production reads. The owner approves entries in config/threshold_approvals.json and
# `python -m src.threshold_apply` applies exactly those. output/league_roi_config.json (no production
# consumer: telegram_bot/notifier.py reads it but its gate is disabled) is no longer rewritten; its
# per-league ROI now lives in the proposal as `roi_by_league`.
#
# vs the old backtest.yml: same outputs, but parallel + no wasted retrain. Keep backtest.yml for
# the monthly full train+backtest; use THIS for fast per-model / on-demand re-backtests.

on:
  schedule:
    - cron: '0 3 1 * *'   # monthly, 1st @ 03:00 UTC — the monthly backtest (replaces the slow
                          # sequential backtest.yml). Models are retrained weekly by retrain.yml,
                          # so this is backtest-only + parallel = ~30min instead of hours.
  workflow_dispatch:
    inputs:
      models:
        description: "Which models (comma list) — default all five"
        default: "standard,newformat,btts,over15,over35"

concurrency:
  group: backtest-matrix
  cancel-in-progress: false

jobs:
  backtest:
    strategy:
      fail-fast: false          # one model failing must not kill the others
      matrix:
        model: [standard, newformat, btts, over15, over35]
    runs-on: ubuntu-latest
    # 120 -> 240. MEASURED, not guessed: the 2026-10-01 run took 2h 1m 56s against a 120-minute
    # cap and was killed. fail-fast is false, so the three side-market jobs finished and
    # committed while `standard` and `newformat` were terminated having written nothing — which
    # is why best_params_side_markets.json updated on 10-01 and backtest_results_standard.csv
    # still dates from 09-01.
    #
    # The cause is the data fix that made the model better: +24,190 fixtures on 2026-09-24 took
    # fd_history from 37,623 to 58,156 rows, and the walk-forward grew with it (Sep 1: 1h 40m).
    # So the improvement froze the gates that decide which bets fire, and nothing reported it —
    # the run shows as a grey partial, not a red failure.
    #
    # 240 leaves real headroom rather than clearing the measured time by minutes: the frame will
    # keep growing, and a cap that only just fits is one good season from silently doing this
    # again. Actions minutes are free on a public repo, so the only cost of a longer cap is a
    # slower failure when something genuinely hangs.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── THE REASON THIS WORKFLOW STOPPED COMMITTING ──────────────────────────────────
      # WOWZA_FULL_ENRICH='1' and APIFOOTBALL_KEY are set below, so every job performs the
      # full xG / inside-box enrichment. There was no cache, so all five started COLD and
      # refetched the entire history. On 2026-10-01 all five exceeded the 120-minute cap and
      # were cancelled; the Sep 1 run, which predates the enrichment being wired in on
      # 2026-09-05, finished the whole matrix in 1h 40m.
      #
      # THIS IS THE THIRD TIME. CLAUDE.md records it for predict.yml on 2026-08-15 (2-3 min
      # -> 10+ against a 15-minute timeout) and retrain.yml carries the same note for itself
      # on 2026-09-06: "retrain.yml got the enrichment switch on the same day and not the
      # cache." predict and retrain were fixed; this workflow was not, and nothing noticed
      # because a timed-out matrix reports as a grey partial rather than a red failure.
      #
      # The consequence was not a slow job, it was FROZEN GATES: best_params_standard.json
      # and backtest_results_standard.csv have not moved since 2026-09-01, so the thresholds
      # deciding which bets fire were still fitted to a model that has since gained xG,
      # +24,190 fixtures and four restored seasons.
      #
      # Same paths and key strategy as retrain.yml: a per-run key so each run writes a fresh
      # entry, and a restore-key prefix so it starts from the most recent one. Scoped per
      # model so the five parallel jobs do not race for one key.
      - name: Cache API-Football responses (makes full enrichment affordable)
        uses: actions/cache@v4
        with:
          path: |
            api_football_cache
            apifootball_ou_cache
          key: af-cache-backtest-${{ matrix.model }}-${{ github.run_id }}
          restore-keys: |
            af-cache-backtest-${{ matrix.model }}-
            af-cache-retrain-

      - name: Backtest ${{ matrix.model }} (backtest-only, no retrain)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # Full xG/inside-box enrichment: weekly job, no tip deadline. Predict leaves this unset.
          WOWZA_FULL_ENRICH: '1'
        run: |
          M="${{ matrix.model }}"
          case "$M" in
            standard|newformat) python pipeline.py --mode backtest --only "$M" ;;
            btts|over15|over35) python pipeline.py --mode backtest-side --market "$M" ;;
            *) echo "unknown model $M"; exit 1 ;;
          esac
      - name: Upload ${{ matrix.model }} results
        uses: actions/upload-artifact@v4
        with:
          name: bt-${{ matrix.model }}
          path: |
            output/backtest_results_${{ matrix.model }}.csv
            output/backtest_by_league_${{ matrix.model }}.csv
            output/threshold_proposals/candidates/best_params_${{ matrix.model }}.json
          if-no-files-found: ignore

  aggregate:
    needs: backtest
    if: always()              # aggregate whatever succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # the proposal resolves the gates production serves (config + src/gate_resolver under the
        # predict.yml env), so it needs the real requirements, not pandas alone
        run: pip install -r requirements.txt
      - name: Download all model results
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Place evidence + write the threshold PROPOSAL (never the production files)
        run: |
          mkdir -p output
          # backtest evidence CSVs only. best_params candidates stay in _artifacts and are read from
          # there; nothing is copied into models/.
          find _artifacts -name 'backtest_*_*.csv' -exec cp {} output/ \; 2>/dev/null || true
          python -m src.threshold_proposals propose --candidates _artifacts --evidence-dir output
          # Belt and braces: fail the run (red, not grey) if anything production reads was touched.
          git diff --exit-code -- models/ config/ output/league_roi_config.json
      - name: Commit results (single commit — no push race)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # PER-FILE (`git add a b missing` stages nothing) and ONLY the proposal + its evidence.
          # Never models/, never config/, never output/league_roi_config.json.
          for f in output/threshold_proposals/*.json output/threshold_proposals/*.md \
                   output/backtest_results_*.csv output/backtest_by_league_*.csv; do
            [ -f "$f" ] && git add -f "$f" || echo "  (skip, not present: $f)"
          done
          if git diff --staged --name-only | grep -E '^(models/|config/|output/league_roi_config\.json)'; then
            echo "refusing to commit a production threshold file from the monthly backtest"; exit 1
          fi
          git diff --staged --quiet || \
            git commit -m "auto: monthly threshold PROPOSAL + backtest evidence $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
