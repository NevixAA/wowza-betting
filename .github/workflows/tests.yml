name: Tests and gates

# Phase 2 (KEY=ci), 2026-11-05. The FULL pytest suite plus the production gates on every push and
# pull request to main and data-truth-100. Before this, no workflow ran the whole suite: a few jobs
# ran one or two test files each, and the data truth gate ran on main pushes only.
#   tests  - python -m pytest tests (offline: tests/conftest.py refuses every non-loopback socket,
#            and the session fails if the run changed any tracked file)
#   gates  - research lock, track registry, dashboard manifest (--check each; every step runs)
# The data truth stoplight (--gate, with its ratchet) stays in data_truth_gate.yml, which now also
# runs on pushes to data-truth-100.
# The only secret either job gets is the READ-ONLY price store key (PRICE_STORE_RO_KEY): since the price cut-over
# (owner 2026-11-24) the price files live only in the private store, and the suite and the gates read them from
# there (scripts/price_store_live.sh open). A test that needs an API key or the network is still a bug.
# Bot pushes (collect, predict, results) use GITHUB_TOKEN and so do not trigger this workflow.

on:
  push:
    branches: [main, data-truth-100, 'phase2/**', prep/bars-oddsapi-hist]
  pull_request:
    branches: [main, data-truth-100, prep/bars-oddsapi-hist]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Price store - open (private prices, owner 2026-11-24)
        # Live price files exist only in the private store (scripts/price_store_live.sh). This puts them at
        # their usual paths before any work and keeps them out of every public commit. Rollback: set the
        # repo variable PRICE_STORE_LIVE to anything but 1.
        env:
          PRICE_STORE_LIVE: ${{ vars.PRICE_STORE_LIVE }}
          PRICE_STORE_RO_KEY: ${{ secrets.PRICE_STORE_RO_KEY }}
          # CI checks out a PR merge ref: read main's store files only when the change targets main.
          PRICE_STORE_ANY_BRANCH: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && '1' || '' }}
        run: bash scripts/price_store_live.sh open wowza-betting

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest pyyaml
      - name: Full test suite (offline)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider tests
      - name: The suite left the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error title=Test hygiene::the test run changed or created files in the repo tree"
            exit 1
          fi

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Price store - open (private prices, owner 2026-11-24)
        # Live price files exist only in the private store (scripts/price_store_live.sh). This puts them at
        # their usual paths before any work and keeps them out of every public commit. Rollback: set the
        # repo variable PRICE_STORE_LIVE to anything but 1.
        env:
          PRICE_STORE_LIVE: ${{ vars.PRICE_STORE_LIVE }}
          PRICE_STORE_RO_KEY: ${{ secrets.PRICE_STORE_RO_KEY }}
          # CI checks out a PR merge ref: read main's store files only when the change targets main.
          PRICE_STORE_ANY_BRANCH: ${{ (github.base_ref == 'main' || github.ref_name == 'main') && '1' || '' }}
        run: bash scripts/price_store_live.sh open wowza-betting

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Research lock
        run: python -m src.research_lock --check
      - name: Track registry is current
        if: always()
        run: python scripts/build_track_registry.py --check
      - name: Dashboard manifest is complete
        if: always()
        run: python scripts/dashboard_manifest.py --check
