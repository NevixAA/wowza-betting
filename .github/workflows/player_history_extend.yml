name: Player History Extend

# Owns player_history.parquet. Split out of player_props.yml on 2026-08-18.
#
# WHY IT IS SEPARATE: a full collect takes ~60 minutes. While it ran inside player_props it
# held the `player-props` concurrency group, so the hourly predict could not run — observed on
# 2026-08-18 when dispatch run #914 blocked #915 (cancelled) and #916 (queued). An hour of
# collection cost an hour of tips.
#
# It also removes a hazard in the freshness gate: the gate asks "is the newest match older
# than 2 days", which is legitimately TRUE between rounds and during international breaks. In
# player_props (hourly) that would have fired an hour-long collect every hour. Here the
# cadence is daily and a cooldown makes a repeat impossible.

on:
  schedule:
    - cron: '40 3 * * *'      # daily, well before the 05:00 props window
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the cooldown and collect now'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: player-history-extend   # deliberately NOT player-props
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 100      # measured ~60 min for a full backfill; headroom, not hope
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Permanent — only genuinely new fixtures cost an API call. This is what makes the
      # steady-state run minutes instead of an hour.
      - name: Cache fixture player stats
        uses: actions/cache@v4
        with:
          path: fixture_player_cache
          key: fixture-player-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fixture-player-${{ runner.os }}-

      - name: Should we collect?
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, subprocess, sys
          from pathlib import Path

          # DIAGNOSTICS GO TO STDERR, NEVER TO $GITHUB_OUTPUT. This whole heredoc is
          # redirected into the output file, which parses `key=value` lines ONLY. A
          # human-readable line there fails the step with
          #     Error: Unable to process file command 'output' successfully
          # which is exactly what happened on run #36 — the gate died, so Report gate and
          # Collect were both skipped and the collect still did not happen. stderr is
          # captured in the run log and parsed by nothing.
          def _note(msg):
              print(msg, file=sys.stderr)

          # Cooldown: when did a collect LAST ACTUALLY RUN? Read from the committed health
          # record, never from git log.
          #
          # THIS IS WHY PLAYER HISTORY FROZE FOR 35 DAYS. The old version ran
          #     git log -1 --format=%cI -- player_history.parquet
          # and called it "read from git rather than a marker file, so it cannot drift out of
          # sync with reality". But actions/checkout@v4 defaults to fetch-depth: 1 — a SHALLOW
          # clone containing only HEAD. In a shallow clone that command cannot see the commit
          # that last touched the file; it returns HEAD's own timestamp, which is always minutes
          # old. So `hours` was always ~0-3, `hours >= 20` was always False, and the collect step
          # never ran. Observed in history_extend_health.json every single day:
          #     "collect": "false", "age_days": "35", "hours_since_commit": "2.1"
          # while the real gap between commits touching that file was 168 hours.
          #
          # The gate was introduced 2026-08-18. player_history.parquet's newest match is
          # 2026-08-17. It has not advanced once since the gate landed, while the workflow ran
          # daily, committed daily, and reported success daily.
          #
          # This is the same defect class as the three mtime-on-CI-checkout bugs in CLAUDE.md:
          # a freshness signal that the CI checkout itself destroys. The prescribed fix is the
          # same — a recorded timestamp in a committed sidecar — and, as with the FPL cache, an
          # UNKNOWN age must mean INFINITELY OLD. Failing the other way is what produced a
          # 35-day silence.
          hours = 999.0
          try:
              hp = Path("output/history_extend_health.json")
              if hp.exists():
                  rec = json.loads(hp.read_text(encoding="utf-8")).get("last_collect_at")
                  if rec:
                      last = dt.datetime.fromisoformat(rec.replace("Z", "+00:00"))
                      hours = (dt.datetime.now(dt.timezone.utc) - last).total_seconds() / 3600
                  else:
                      _note("no last_collect_at recorded -> treating as infinitely old")
          except Exception as e:
              _note(f"cooldown check failed ({e}) -> treating as infinitely old")

          newest, age = "missing", 9999
          try:
              import pandas as pd
              p = Path("player_history.parquet")
              if p.exists():
                  d = pd.read_parquet(p, columns=["date"])
                  newest = str(pd.to_datetime(d["date"]).max())[:10]
                  age = (dt.date.today() - dt.date.fromisoformat(newest)).days
          except Exception as e:
              _note(f"freshness check failed ({e})")

          forced = "${{ github.event.inputs.force }}" == "true"
          # A full collect is an hour of runtime and ~4,300 API calls, so never more than
          # once a day unless forced. `age` alone is not a sufficient trigger: it is
          # legitimately > 2 between rounds, and would otherwise loop forever.
          go = forced or (age > 2 and hours >= 20)
          print(f"collect={'true' if go else 'false'}")
          print(f"newest={newest}")
          print(f"age_days={age}")
          print(f"hours_since_commit={hours:.1f}")
          if not go:
              _note(f"skipping: age={age}d, last collect {hours:.1f}h ago")
          PY

      - name: Report gate
        run: |
          echo "newest match      : ${{ steps.gate.outputs.newest }}"
          echo "age (days)        : ${{ steps.gate.outputs.age_days }}"
          echo "last commit (hrs) : ${{ steps.gate.outputs.hours_since_commit }}"
          echo "collecting        : ${{ steps.gate.outputs.collect }}"

      - name: Collect club league data
        id: collect
        if: steps.gate.outputs.collect == 'true'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode collect 2>&1 | tee /tmp/collect.log

      - name: Record health
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          h = {
              "checked_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_number": os.getenv("GITHUB_RUN_NUMBER"),
              "gate": {
                  "collect": "${{ steps.gate.outputs.collect }}",
                  "newest_before": "${{ steps.gate.outputs.newest }}",
                  "age_days": "${{ steps.gate.outputs.age_days }}",
                  "hours_since_commit": "${{ steps.gate.outputs.hours_since_commit }}",
              },
              "collect_outcome": "${{ steps.collect.outcome }}",
          }
          # THE COOLDOWN SIDECAR. The gate above reads this field and nothing else; it must be
          # carried forward when no collect ran, or every run would look like "never collected"
          # and the cooldown would stop existing. It is only ADVANCED when a collect actually
          # executed — a skipped run must not reset the clock, which is the whole point.
          prev = {}
          try:
              with open("output/history_extend_health.json", encoding="utf-8") as fh:
                  prev = json.load(fh)
          except Exception:
              pass
          if "${{ steps.collect.outcome }}" in ("success", "failure"):
              h["last_collect_at"] = h["checked_at"]      # it ran; start the cooldown now
          elif prev.get("last_collect_at"):
              h["last_collect_at"] = prev["last_collect_at"]   # carry the old stamp forward
          # else: leave it absent -> the gate reads that as infinitely old and collects.
          try:
              import pandas as pd
              d = pd.read_parquet("player_history.parquet", columns=["date"])
              h["parquet"] = {"rows": len(d),
                              "newest_after": str(pd.to_datetime(d["date"]).max())[:10]}
          except Exception as e:
              h["parquet"] = {"error": str(e)}
          try:
              with open("/tmp/collect.log", encoding="utf-8", errors="replace") as fh:
                  h["collect_log_tail"] = fh.read().splitlines()[-30:]
          except Exception:
              h["collect_log_tail"] = ["(no collect this run)"]
          os.makedirs("output", exist_ok=True)
          with open("output/history_extend_health.json", "w", encoding="utf-8") as fh:
              json.dump(h, fh, indent=2)
          print(json.dumps({k: v for k, v in h.items() if k != "collect_log_tail"}, indent=2))
          PY
        continue-on-error: true

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Per-file, so one absent path cannot stage nothing (see player_props.yml).
          for f in player_history.parquet output/history_extend_health.json; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: player history extend $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          echo "::error title=history extend push failed::Collected but not persisted."
          exit 1

      - name: Fail if the collect failed
        if: always()
        run: |
          if [ "${{ steps.collect.outcome }}" = "failure" ]; then
            echo "::error title=collect failed::player_history.parquet did not advance."
            exit 1
          fi
