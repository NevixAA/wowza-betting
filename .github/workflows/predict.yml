name: Predict

on:
  # RE-ENABLED 2026-08-09 after the new-format calibration bug was fixed + retrained
  # (NF p_over25 0.36 -> 0.50, balanced over/under). See PERFORMANCE_CUTOFF_DATE in config.
  schedule:
    - cron: '1-59/5 8-23 * * *'   # every 5 min during match hours — offset :01 to stagger runners
  workflow_dispatch:

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run predict
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # APIFOOTBALL_KEY was MISSING here while every other workflow passed it. The secret
          # exists; this step just never mapped it, so os.getenv("APIFOOTBALL_KEY") was "" and
          # every API-Football enrichment in build_upcoming_features silently no-opped inside
          # its `except: pass` — injuries, /teams/statistics season venue stats, lineups, H2H,
          # Bet365 pre-match odds, season round, coach, standings. The season venue stats are
          # real model inputs, so predict was running on stale football-data values instead of
          # current-season ones; the rest degraded predictions.csv and the dashboard.
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python pipeline.py --mode predict

      - name: Run Telegram notifier
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python telegram_bot/notifier.py
        continue-on-error: true

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each file INDIVIDUALLY: a single missing pathspec makes `git add a b missing`
          # abort and stage NOTHING (the `|| true` then hides it) -> no commit -> notified.json
          # dedup never persists -> every 5-min run re-sends the same tips (the duplicate flood).
          # odds_history_v9.json drives the ENTIRE drift feature. It is per-run state, so if
          # it isn't committed the next run starts blank -> drift_signal stuck on "New" and
          # the tier upgrade/downgrade in betting.py never fires. It was gitignored until
          # 2026-08-15; drift.py now stores price CHANGES only, so it stays small.
          for f in output/bets.csv output/bets_ledger.csv output/predictions.csv \
                   odds_history_v9.json \
                   output/side_bets_ledger.csv output/standard_odds_history.csv output/ht_ledger.csv \
                   output/postponed.csv output/worldcup_tips.csv output/sharp_tips.csv \
                   output/live_tips.csv output/live_games.csv \
                   output/worldcup_history.json output/sharp_history.json \
                   output/predict_health.json output/feature_health.json \
                   telegram_bot/notified.json telegram_bot/live_notified.json; do
            git add -f "$f" 2>/dev/null || true
          done
          git diff --staged --quiet || \
            git commit -m "auto: predict $(date -u '+%Y-%m-%d %H:%M UTC')"
          git restore . 2>/dev/null || true
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
