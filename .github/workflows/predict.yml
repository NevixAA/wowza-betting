name: Predict

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'   # 06:00, 10:00, 14:00, 18:00, 22:00 UTC
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain models (ensures new features are compatible)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py --mode train

      - name: Run predict
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py --mode predict

      - name: Run Telegram notifier
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python telegram_bot/notifier.py
        continue-on-error: true

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add output/bets.csv output/bets_ledger.csv output/predictions.csv \
                  output/postponed.csv output/worldcup_tips.csv output/sharp_tips.csv \
                  output/live_tips.csv output/live_games.csv \
                  output/worldcup_history.json output/sharp_history.json \
                  telegram_bot/notified.json telegram_bot/live_notified.json || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: predict $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
