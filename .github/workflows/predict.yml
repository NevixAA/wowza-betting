name: Predict

on:
  # RE-ENABLED 2026-08-09 after the new-format calibration bug was fixed + retrained
  # (NF p_over25 0.36 -> 0.50, balanced over/under). See PERFORMANCE_CUTOFF_DATE in config.
  schedule:
    - cron: '1-59/5 8-23 * * *'   # every 5 min during match hours — offset :01 to stagger runners
  workflow_dispatch:

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    # 25 not 15: enrichment is back on (see the APIFOOTBALL_KEY note below) and the FIRST
    # run after a cache miss legitimately takes longer while it refills api_football_cache.
    # A timed-out predict sends no tips at all, so the margin is deliberate.
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # THE reason the first attempt at enabling enrichment failed. Without this the cache
      # is cold on every 5-minute run, so all eight API-Football enrichments re-fetch from
      # scratch: runtime went 2-3 min -> 10+ against the timeout, and ~4,600 calls burned in
      # 90 minutes. The TTLs are hours to days (lineups 2h, odds 6h, H2H 168h, coach 7d), so
      # a warm cache makes the steady-state cost a small fraction of a cold run.
      - name: Cache API-Football responses (makes enrichment affordable)
        uses: actions/cache@v4
        with:
          path: api_football_cache
          key: af-cache-${{ github.run_id }}
          restore-keys: af-cache-

      - name: Run predict
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # RE-ENABLED 2026-08-16, after the two preconditions were met: the API-Football
          # plan moved to 75,000/day, and the cache step above now persists
          # api_football_cache/ between runs.
          #
          # History: this key was missing originally, so every enrichment in
          # build_upcoming_features silently no-opped inside its `except: pass` — injuries,
          # /teams/statistics, lineups, H2H, Bet365 odds, season round, coach, standings —
          # and 33 columns of predictions.csv were pinned to hardcoded defaults. Enabling it
          # on 2026-08-15 WITHOUT the cache pushed runtime from 2-3 min to 10+ against the
          # timeout and burned ~4,600 calls in 90 minutes, so it was reverted.
          #
          # What this buys: /teams/statistics supplies current-season venue goals, conceded
          # and clean-sheet rates, which ARE real model inputs — predict has been scoring on
          # stale football-data values instead. The rest populate predictions.csv and the
          # dashboard.
          #
          # REVERTED AGAIN 2026-08-16, immediately. Caching the API responses was NOT the
          # missing piece. With the key present, load_all_matches() runs
          # _enrich_with_api_shots over the ENTIRE HISTORY on every 5-minute run:
          #
          #   [af_history] merged backfill: 26460 rows now have shot data
          #   [api_football_ou] Ireland Premier Division: 258/857 rows now have shot data
          #   [api_football_ou] Austrian Bundesliga: 130/981 rows now have shot data
          #
          # ~3 minutes PER LEAGUE, and the run was at 11m52s and still going. It is
          # re-deriving historical shot data that is already backfilled and committed in
          # output/af_history.parquet and the odds-history CSVs. Predict needs new fixtures,
          # not a rebuild of four seasons of history.
          #
          # The enrichment cannot be switched on here until load_all_matches stops re-doing
          # historical work per run — it must read the committed backfill and fetch only
          # what is genuinely new. That is a code fix, not a quota or cache problem.
        run: python pipeline.py --mode predict

      - name: Run Telegram notifier
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python telegram_bot/notifier.py
        continue-on-error: true

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each file INDIVIDUALLY: a single missing pathspec makes `git add a b missing`
          # abort and stage NOTHING (the `|| true` then hides it) -> no commit -> notified.json
          # dedup never persists -> every 5-min run re-sends the same tips (the duplicate flood).
          # odds_history_v9.json drives the ENTIRE drift feature. It is per-run state, so if
          # it isn't committed the next run starts blank -> drift_signal stuck on "New" and
          # the tier upgrade/downgrade in betting.py never fires. It was gitignored until
          # 2026-08-15; drift.py now stores price CHANGES only, so it stays small.
          for f in output/bets.csv output/bets_ledger.csv output/predictions.csv \
                   odds_history_v9.json team_id_cache.json \
                   output/side_bets_ledger.csv output/standard_odds_history.csv output/ht_ledger.csv \
                   output/newformat_odds_dense.csv \
                   output/postponed.csv output/worldcup_tips.csv output/sharp_tips.csv \
                   output/live_tips.csv output/live_games.csv \
                   output/worldcup_history.json output/sharp_history.json \
                   output/predict_health.json output/feature_health.json \
                   telegram_bot/notified.json telegram_bot/live_notified.json; do
            git add -f "$f" 2>/dev/null || true
          done
          git diff --staged --quiet || \
            git commit -m "auto: predict $(date -u '+%Y-%m-%d %H:%M UTC')"
          git restore . 2>/dev/null || true
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
