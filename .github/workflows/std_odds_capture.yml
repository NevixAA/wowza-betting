name: Standard Side-Market Odds Capture

# FORWARD capture of STANDARD 2nd-div side-market odds (BTTS + O/U 1.5/2.5/3.5).
# standard_sidemarket_odds_history.csv was BACKFILL-ONLY (static since 2026-05-18) -> standard
# BTTS/O1.5/O3.5 had NO forward open->moving->closing capture. This appends today's odds for
# upcoming standard fixtures daily. FREE: API-Football (Bet365), NO OddsAPI credits.
# ISOLATION: writes ONLY output/standard_sidemarket_odds_history.csv. No model touched.
# Cost: self-gating (off match-days -> no upcoming fixtures -> ~free); NEXT_N=12, quota-guarded.

concurrency:
  group: std-odds-capture
  cancel-in-progress: false

on:
  schedule:
    # HOURLY during football hours, 3-hourly overnight (2026-08-19).
    #
    # History: 3x/day gave ~1.1 snapshots per fixture — an ENTRY PRICE, not a curve — which is
    # why standard BTTS / O-U 1.5 / 3.5 CLV was unusable. 8x/day (2026-08-16) helped but still
    # cannot produce the horizons the research plan needs: T-1h, T-30m and T-10m simply do not
    # exist at 3-hourly spacing, and those are exactly where the closing line forms.
    #
    # Why this is the right place to spend: CLV is the single measurement that decides whether
    # any model here is real, and CLV is ENTIRELY a function of snapshot density. More
    # predictions of the same fixture add nothing — the price is what moves. Measured usage is
    # ~10-11k/day against a 75,000 cap, so this is funded out of existing headroom and requires
    # no cut elsewhere.
    #
    # Cost: ~330-380 calls per window. 19 windows is ~6,600/day, taking the total to roughly
    # 17k — still under 25% of the cap. Self-gating: no upcoming fixtures means a near-free run.
    # WIDE — every fixture in the look-ahead window, 4x/day. Covers the far horizon
    # (T-7d, T-3d, T-24h) where prices move slowly. ~350 calls each = ~1,400/day.
    - cron: '5 0,6,12,18 * * *'
    # NEAR — only fixtures kicking off within 12h, every 15 minutes. This is where the closing
    # line actually forms, and it is CHEAP because only a handful of fixtures are ever imminent:
    # about 24 kick off per day across all leagues, so ~12 inside any 12h window. ~40 calls
    # each = ~3,800/day, and it is what makes T-1h / T-30m / T-10m exist at all.
    # CUT 2026-08-29: every 15 min (96/day) -> hourly (24/day). Two reasons, and the first is that
    # this cron was largely redundant with itself: a scheduled NEAR run ALREADY samples internally
    # for LOOP_MIN=25 minutes, so firing four times an hour asked for four overlapping 25-minute
    # loops. Second, the repo was asking for 696 scheduled runs on a Saturday and GitHub delivered
    # about 4%; this workflow got 3 of its runs in 12 hours. Requesting 24 that land beats
    # requesting 96 that are dropped, and one hourly firing plus its internal loop covers 25 of
    # every 60 minutes rather than the ~3 windows a day actually being delivered.
    # :23 deliberately — not :00 or :15, which are GitHub's most contended minutes.
    #
    # ALIGNED TO THE KICKOFF CLOCK, 2026-09-02. Measured over 594 fixtures in the canonical
    # store, kickoff minute-of-hour is not uniform at all:
    #
    #     :00  60.6%      :30  25.9%      :45  8.1%      everything else  5.4%
    #
    # So 86.5% of kickoffs land on :00 or :30, and a capture's distance to the close is decided
    # by which minute it fires, not by how often. :23 was already well placed for the :30 group
    # (T-7m) and badly placed for the :00 group (T-37m) — which is the larger half.
    #
    # :52 closes that gap at T-8m for a :00 kickoff. Together the two slots put a capture inside
    # T-10m for 86.5% of fixtures, against a measured T-10m coverage of 8.7% today.
    #
    # And the window is trimmed: hours 04:00-08:00 UTC contain ZERO kickoffs in the entire store,
    # so five firings a day were being spent where nothing could be near its close. Dropping them
    # pays for most of the second slot.
    #
    # Net 24/day -> 36/day, funded from the 165 runs/day freed across the estate on 2026-08-30.
    # This is the single highest-value use of that headroom: /odds is pre-match only, so a close
    # not captured is gone permanently.
    - cron: '23,52 0-3,9-23 * * *'
    # 04:00-08:00 UTC added back 2026-10-26 (owner-approved). Still zero standard kickoffs
    # in those hours, but 14.6% of standard fixtures kick off 11:00-12:59 and inside 6 h of
    # kickoff the engine refuses a price older than 3 h: a 12:30 Saturday kickoff was 5.5 h
    # stale at 09:25. A run here prices only fixtures within 12 h (17 fixture-list calls + one
    # odds call per imminent fixture, hourly), ~20-60 calls a run, and it can also host a
    # due WIDE pass. Ten requested slots, typically 2-4 delivered.
    - cron: '23,52 4-8 * * *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'Only price fixtures within N hours (blank = all/WIDE)'
        required: false
        default: ''
      loop_minutes:
        description: 'Base loop length in minutes before keep-alive applies (blank = 40)'
        required: false
        default: ''

jobs:
  std_odds_capture:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES (25) plus checkout/pip/commit, or the timeout kills the loop
    # mid-window and the whole run commits nothing.
    # NOT just "long runs are free because minutes are free on a public repo" — that was the
    # reasoning that produced the 100-minute loop, and it was wrong. The concurrency group holds
    # only ONE pending run, so a long run does not make later firings queue politely: each new
    # firing CANCELS the one waiting behind it. The run length must therefore stay well under the
    # real delivery interval, not merely under the timeout.
    # 40 -> 65. The loop base is 40 minutes and a kickoff extension can carry it to
    # MAX_LOOP_MIN=50; checkout, pip and the commit add several more. A timeout below the
    # loop cap does not shorten the loop, it KILLS the run mid-window and commits nothing —
    # which is the failure this capture exists to avoid.
    # 2026-10-22: CAP 170 (adaptive keep-alive) + checkout/pip/commit. A timeout below the cap
    # would kill the run mid-window and commit nothing.
    timeout-minutes: 195
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A queued scheduled run otherwise checks out the SHA of its SCHEDULE time, so it would
          # read a stale output/capture_wide state and could repeat a WIDE pass already done.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture forward standard side-market odds
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # PER-BOOKMAKER RETENTION, ON since 2026-10-04. This drops the `bookmaker=8` filter
          # so the SAME request returns every book instead of one -- identical call count,
          # identical quota, and the consensus archive this workflow already writes is byte
          # for byte unchanged. Nothing reads book_quotes yet; it is collection only.
          #
          # Turned on now rather than "when something needs it" because /odds is PRE-MATCH ONLY
          # (established 2026-08-19 over ~830 calls: 0 of 3 FT fixtures returned odds in every
          # season 2019-2025, and 770 consecutive Brazil fetches came back 100% empty). A
          # closing line not captured today cannot be bought back at any price.
          CAPTURE_BOOK_QUOTES: "1"
          # WIDE-pass guard (src/capture_schedule.wide_due). One WIDE pass prices every look-ahead
          # fixture: ~17+17x28 = ~490 calls (std) / ~15+15x20 = ~315 (nf). 4/day by the 6 h rule;
          # the call cap is a hard ceiling on what WIDE passes may spend per UTC day.
          CAPTURE_WIDE_EVERY_H: "6"
          CAPTURE_WIDE_MAX_PER_DAY: "4"
          CAPTURE_WIDE_MAX_CALLS_PER_DAY: "2200"
        run: |
          # The 15-minute cron is the NEAR run and prices only imminent fixtures; the 4x/day
          # cron is WIDE and prices everything. One script, one flag, so the two cadences cannot
          # drift apart in behaviour.
          # ── NEAR vs WIDE: MATCH THE WIDE CRON, DEFAULT TO NEAR ─────────────────────────
          # THIS WAS BROKEN FOR TWO WEEKS AND IT COST THE CLOSING LINE.
          #
          # The test used to be `schedule == '*/15 * * * *'` -> NEAR. That cron was replaced on
          # 2026-08-29 (96/day -> hourly) and again on 2026-09-02 (kickoff-aligned), and the
          # comparison string was never updated. GitHub sets github.event.schedule to the EXACT
          # cron that fired, so once the string stopped existing the test could never be true:
          # MH stayed empty, every scheduled run took the WIDE branch, and the NEAR loop below —
          # the only thing that produces T-1h / T-30m / T-10m density — became unreachable.
          #
          # Confirmed in the data: standard_sidemarket_odds_history.csv has NO loop-spaced
          # capture (<=10 min apart) since 2026-08-23. Measured effect on fixtures kicking off
          # after 2026-09-03, against those before it:
          #
          #     T-10m coverage   8.7%  ->  3.2%
          #     T-1h  coverage  34.0%  -> 32.3%
          #
          # It also explains where the budget went: WIDE prices every look-ahead fixture, which
          # is why 81.0% of all market observations sit on fixtures more than 24h out and 0.6%
          # fall in the final hour.
          #
          # The test is now INVERTED: match the WIDE cron explicitly, and treat every other
          # scheduled firing as NEAR. That fails SAFE — if the wide cron is edited, runs become
          # NEAR and only the far horizon thins, instead of the close disappearing. And the mode
          # is echoed, so the next person can see which branch ran without reading the YAML.
          MH="${{ github.event.inputs.max_hours }}"
          SCHED="${{ github.event.schedule }}"
          WIDE_CRON='5 0,6,12,18 * * *'
          if [ -z "$MH" ] && [ -n "$SCHED" ] && [ "$SCHED" != "$WIDE_CRON" ]; then
            MH=12
          fi
          if [ -n "$MH" ]; then
            echo "mode=NEAR (within ${MH}h)  schedule='${SCHED:-manual}'"
          else
            echo "mode=WIDE (all look-ahead fixtures)  schedule='${SCHED:-manual}'"
          fi

          # ── Why the NEAR run LOOPS instead of relying on the cron ───────────────────────
          # MEASURED 2026-08-19: this workflow's '*/15' cron asks for 96 runs/day and GitHub
          # delivered 20 runs in 2.3 days — a median interval of 179 minutes, 12x under the
          # request. predict is the same story (5-minute cron, 34-minute median). The cause is
          # NOT runner contention: queue wait created->started was 0s at median, p90 AND max, so
          # runs start instantly when they exist. GitHub's shared cron scheduler simply drops
          # most high-frequency schedule events, and no plan or setting changes that — Actions
          # minutes are already free and unlimited on this public repo.
          #
          # The consequence was that the whole point of the NEAR cadence was lost: since it went
          # live only 11 distinct snapshot minutes were recorded, with a median 1,996 minutes
          # between consecutive price changes. That is an entry price, not a closing curve, which
          # is the exact defect the NEAR run was added to fix.
          #
          # So take the density inside ONE run, which the scheduler cannot throttle. Each firing
          # now samples repeatedly for LOOP_MINUTES: 5 passes per firing, so ~9 firings/day give
          # ~45 captures instead of 9 — fewer than the 100 the first attempt claimed, but they
          # actually land instead of being cancelled.
          # Safe to do because the script keeps only CONSECUTIVE-DISTINCT prices: a pass where
          # nothing moved writes NO row, so extra passes can only add real movements, never bloat.
          # The commit still happens ONCE after the loop, so this adds no push-race risk.
          # ── ADAPTIVE NEAR LOOP (P1 2026-10-22) ─────────────────────────────────────────────
          # Certified CLV needs an observation inside the final 30 minutes (shadow_settlement
          # CLOSE_MAX_MIN). Measured 2026-10-04..10-22: a capture RAN inside T-30m for only ~30% of
          # fixtures, because a delivered run (GitHub delivers ~8/day whatever the cron asks) lived
          # 40-50 minutes and then stopped. Two changes, both decided in src/capture_schedule.py:
          #   * KEEP-ALIVE: past BASE minutes the run keeps sampling while a kickoff it has seen is
          #     within KEEPALIVE minutes, never past CAP. Replayed on the measured run starts:
          #     T-30m "a capture ran" ~44% -> ~76% (new-format), ~34% -> ~90% (standard).
          #   * PER-FIXTURE DUE INTERVALS: each pass prices a fixture only when it is due (hourly
          #     beyond 6h, ~15 min at 1-6h, ~5 min at 30-60 min, EVERY pass inside 30 min), and
          #     passes tighten to 2 minutes when a kickoff is inside 35 minutes. That moves the
          #     API spend to where the close forms and is what pays for the longer runs.
          # The script prints LOOP_CONTINUE / LOOP_SLEEP_S; the loop just obeys. A pass that
          # prints nothing (crashed) falls back to "continue at 5 minutes while inside BASE".
          # A WIDE firing does its one wide pass first and then joins the same NEAR loop, so every
          # delivered run is used for the close.
          # The concurrency group holds one pending run: a firing that lands while this run is
          # alive waits and starts as soon as it ends, so a long run chains instead of overlapping.
          # Shadow settlement waits CLOSE_SETTLE_DELAY_MIN (240) after kickoff, longer than CAP plus
          # the commit, so a close captured by a long run is on main before the row is settled.
          export CAPTURE_STATE="${RUNNER_TEMP:-/tmp}/capture_state.json"
          export LOOP_START_S=$(date -u +%s)
          export LOOP_BASE_MIN="${{ github.event.inputs.loop_minutes }}"
          [ -n "$LOOP_BASE_MIN" ] || LOOP_BASE_MIN=40
          export LOOP_KEEPALIVE_MIN=90
          export LOOP_CAP_MIN=170
          rm -f "$CAPTURE_STATE"

          # ── WIDE PASSES FROM INSIDE THE LOOP (owner-approved 2026-10-26) ─────────────────────
          # The WIDE cron used to be the ONLY way a WIDE pass happened, and GitHub cannot hit a
          # clock: measured 2026-10-05..10-26, 3.2-3.3 WIDE passes/day were delivered against 4
          # requested, hours late and with 7-9 h gaps. The market-first engine refuses a far book
          # quote older than 12 h, so now EVERY pass of this loop first asks
          # `python -m src.capture_schedule wide-due`, which answers from a RECORDED timestamp in
          # the committed file below (never mtime; missing/corrupt = infinitely old = run now).
          # Due at >= CAPTURE_WIDE_EVERY_H hours; hard-capped per UTC day by pass count and by the
          # API calls WIDE passes spent; never inside the last 15 minutes before the loop cap.
          # The WIDE cron is now just one more firing that asks the same question. A manual run
          # with blank max_hours still forces one WIDE pass. If the check itself fails, the old
          # rule applies: one WIDE pass on the WIDE cron, none otherwise.
          export CAPTURE_WIDE_STATE="output/capture_wide/std_capture.json"
          FORCE_WIDE=0
          WIDE_FALLBACK_DONE=0
          LAST_KO=""      # nearest kickoff (min) from the last NEAR pass: a WIDE pass waits while
                          # a close is forming (<=35 min), at most 2 h past due
          if [ -z "$MH" ]; then
            [ -n "$SCHED" ] || FORCE_WIDE=1
            MH=12
          fi
          wide_if_due() {
            if [ "$FORCE_WIDE" = "1" ]; then
              FORCE_WIDE=0
              WD="$(printf 'WIDE_DUE=1\nWIDE_REASON=MANUAL')"
            else
              WD=$(python -m src.capture_schedule wide-due --state "$CAPTURE_WIDE_STATE" \
                     --next-ko-min "$LAST_KO" 2>&1)
              if ! printf '%s\n' "$WD" | grep -q '^WIDE_DUE=[01]$'; then
                echo "  [wide] due check failed: $WD"
                if [ "$SCHED" = "$WIDE_CRON" ] && [ "$WIDE_FALLBACK_DONE" != "1" ]; then
                  WIDE_FALLBACK_DONE=1; WD="WIDE_DUE=1"
                else
                  WD="WIDE_DUE=0"
                fi
              fi
            fi
            printf '%s\n' "$WD" | sed 's/^/  [wide] /'
            if printf '%s\n' "$WD" | grep -q '^WIDE_DUE=1$'; then
              echo "WIDE pass: all fixtures in the look-ahead window"
              python scripts/capture_std_sidemarket_odds_forward.py || echo "  (wide pass failed - continuing)"
            fi
          }

          echo "NEAR loop: fixtures within ${MH}h, base ${LOOP_BASE_MIN}m, keep-alive ${LOOP_KEEPALIVE_MIN}m, cap ${LOOP_CAP_MIN}m"
          i=0
          while : ; do
            i=$((i + 1))
            echo "--- pass $i  $(date -u '+%H:%M:%S') ---"
            wide_if_due
            OUT_TXT=$(python scripts/capture_std_sidemarket_odds_forward.py --max-hours "$MH" 2>&1) || echo "  (pass $i failed - continuing)"
            echo "$OUT_TXT"
            LAST_KO=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^NEXT_KO_MIN=\([0-9][0-9]*\)$/\1/p' | tail -1)
            CONT=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^LOOP_CONTINUE=\([01]\)$/\1/p' | tail -1)
            SLEEP_S=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^LOOP_SLEEP_S=\([0-9][0-9]*\)$/\1/p' | tail -1)
            if [ -z "$CONT" ] || [ -z "$SLEEP_S" ]; then
              SLEEP_S=300
              ELAPSED=$(( $(date -u +%s) - LOOP_START_S + SLEEP_S ))
              if [ "$ELAPSED" -lt $(( LOOP_BASE_MIN * 60 )) ]; then CONT=1; else CONT=0; fi
            fi
            [ "$CONT" = "1" ] || break
            echo "  next pass in ${SLEEP_S}s"
            sleep "$SLEEP_S"
          done
          echo "completed $i passes over $(( ( $(date -u +%s) - LOOP_START_S ) / 60 ))m"

      - name: Commit and push updated standard side-market odds history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/standard_sidemarket_odds_history.csv 2>/dev/null || true
          # STAGE THE BOOK QUOTES TOO. Omitting this is the exact failure that killed `predict`
          # on 2026-08-15: every functional step green, the data captured, and nothing persisted
          # because the commit never included it. A directory of monthly parts, so only the
          # current month's file is ever modified.
          git add -f output/book_quotes 2>/dev/null || true
          # Last-seen heartbeat (src/odds_heartbeat.py): this writer's own directory only.
          git add -f output/odds_heartbeat/std_capture 2>/dev/null || true
          # Recorded WIDE-pass timestamp + per-day counters (src/capture_schedule.wide_due).
          git add -f output/capture_wide/std_capture.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: std side-market odds capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # NO `-X ours` here. During a rebase `ours` is UPSTREAM, so `-X ours` resolved every
            # push race in favour of whoever pushed first and silently dropped THIS run's rows
            # (verified in a scratch repo: 3 appended rows lost, git reporting "dropping <sha> --
            # patch contents already upstream", workflow still green). With this file declared
            # merge=union in .gitattributes, a plain rebase keeps BOTH sides' appends instead.
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
