name: Standard Side-Market Odds Capture

# FORWARD capture of STANDARD 2nd-div side-market odds (BTTS + O/U 1.5/2.5/3.5).
# standard_sidemarket_odds_history.csv was BACKFILL-ONLY (static since 2026-05-18) -> standard
# BTTS/O1.5/O3.5 had NO forward open->moving->closing capture. This appends today's odds for
# upcoming standard fixtures daily. FREE: API-Football (Bet365), NO OddsAPI credits.
# ISOLATION: writes ONLY output/standard_sidemarket_odds_history.csv. No model touched.
# Cost: self-gating (off match-days -> no upcoming fixtures -> ~free); NEXT_N=12, quota-guarded.

concurrency:
  group: std-odds-capture
  cancel-in-progress: false

on:
  schedule:
    # HOURLY during football hours, 3-hourly overnight (2026-08-19).
    #
    # History: 3x/day gave ~1.1 snapshots per fixture — an ENTRY PRICE, not a curve — which is
    # why standard BTTS / O-U 1.5 / 3.5 CLV was unusable. 8x/day (2026-08-16) helped but still
    # cannot produce the horizons the research plan needs: T-1h, T-30m and T-10m simply do not
    # exist at 3-hourly spacing, and those are exactly where the closing line forms.
    #
    # Why this is the right place to spend: CLV is the single measurement that decides whether
    # any model here is real, and CLV is ENTIRELY a function of snapshot density. More
    # predictions of the same fixture add nothing — the price is what moves. Measured usage is
    # ~10-11k/day against a 75,000 cap, so this is funded out of existing headroom and requires
    # no cut elsewhere.
    #
    # Cost: ~330-380 calls per window. 19 windows is ~6,600/day, taking the total to roughly
    # 17k — still under 25% of the cap. Self-gating: no upcoming fixtures means a near-free run.
    # WIDE — every fixture in the look-ahead window, 4x/day. Covers the far horizon
    # (T-7d, T-3d, T-24h) where prices move slowly. ~350 calls each = ~1,400/day.
    - cron: '5 0,6,12,18 * * *'
    # NEAR — only fixtures kicking off within 12h, every 15 minutes. This is where the closing
    # line actually forms, and it is CHEAP because only a handful of fixtures are ever imminent:
    # about 24 kick off per day across all leagues, so ~12 inside any 12h window. ~40 calls
    # each = ~3,800/day, and it is what makes T-1h / T-30m / T-10m exist at all.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'Only price fixtures within N hours (blank = all/WIDE)'
        required: false
        default: ''
      loop_minutes:
        description: 'NEAR only: keep sampling for N minutes (blank = 25)'
        required: false
        default: ''
      loop_every:
        description: 'NEAR only: minutes between passes (blank = 5)'
        required: false
        default: ''

jobs:
  std_odds_capture:
    runs-on: ubuntu-latest
    # Must exceed LOOP_MINUTES (25) plus checkout/pip/commit, or the timeout kills the loop
    # mid-window and the whole run commits nothing.
    # NOT just "long runs are free because minutes are free on a public repo" — that was the
    # reasoning that produced the 100-minute loop, and it was wrong. The concurrency group holds
    # only ONE pending run, so a long run does not make later firings queue politely: each new
    # firing CANCELS the one waiting behind it. The run length must therefore stay well under the
    # real delivery interval, not merely under the timeout.
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture forward standard side-market odds
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # The 15-minute cron is the NEAR run and prices only imminent fixtures; the 4x/day
          # cron is WIDE and prices everything. One script, one flag, so the two cadences cannot
          # drift apart in behaviour.
          MH="${{ github.event.inputs.max_hours }}"
          if [ -z "$MH" ] && [ "${{ github.event.schedule }}" = '*/15 * * * *' ]; then
            MH=12
          fi

          # ── Why the NEAR run LOOPS instead of relying on the cron ───────────────────────
          # MEASURED 2026-08-19: this workflow's '*/15' cron asks for 96 runs/day and GitHub
          # delivered 20 runs in 2.3 days — a median interval of 179 minutes, 12x under the
          # request. predict is the same story (5-minute cron, 34-minute median). The cause is
          # NOT runner contention: queue wait created->started was 0s at median, p90 AND max, so
          # runs start instantly when they exist. GitHub's shared cron scheduler simply drops
          # most high-frequency schedule events, and no plan or setting changes that — Actions
          # minutes are already free and unlimited on this public repo.
          #
          # The consequence was that the whole point of the NEAR cadence was lost: since it went
          # live only 11 distinct snapshot minutes were recorded, with a median 1,996 minutes
          # between consecutive price changes. That is an entry price, not a closing curve, which
          # is the exact defect the NEAR run was added to fix.
          #
          # So take the density inside ONE run, which the scheduler cannot throttle. Each firing
          # now samples repeatedly for LOOP_MINUTES: 5 passes per firing, so ~9 firings/day give
          # ~45 captures instead of 9 — fewer than the 100 the first attempt claimed, but they
          # actually land instead of being cancelled.
          # Safe to do because the script keeps only CONSECUTIVE-DISTINCT prices: a pass where
          # nothing moved writes NO row, so extra passes can only add real movements, never bloat.
          # The commit still happens ONCE after the loop, so this adds no push-race risk.
          LOOP_MIN="${{ github.event.inputs.loop_minutes }}"
          LOOP_EVERY="${{ github.event.inputs.loop_every }}"
          # SIZED TO FIT THE DELIVERY INTERVAL (fixed 2026-08-19, second attempt).
          # The first version looped for 100 minutes. That was wrong: this workflow's concurrency
          # group only allows ONE pending run, so while a 100-120 minute loop held the group every
          # subsequent cron firing queued and was then CANCELLED by the firing after it. Measured:
          # 7 of 22 runs cancelled after sitting queued 15-44 minutes, and the successful loops ran
          # 99-122 minutes against a 120-minute timeout, i.e. no margin at all.
          # No data was lost - the long runs did commit - but most firings were wasted and the run
          # list looked broken.
          # 25 minutes at 5-minute spacing gives 5 passes, FINER near-kickoff resolution than the
          # old 10-minute spacing, and finishes well inside the ~30-45 minute real delivery gap so
          # runs stop piling up.
          [ -n "$LOOP_MIN" ]   || LOOP_MIN=25
          [ -n "$LOOP_EVERY" ] || LOOP_EVERY=5

          if [ -z "$MH" ]; then
            echo "WIDE run: all fixtures in the look-ahead window (single pass)"
            python scripts/capture_std_sidemarket_odds_forward.py
            exit 0
          fi

          # ADAPTIVE SPACING (added 2026-08-26). LOOP_MIN stays at 25 deliberately — it was sized
          # to finish inside the real ~30-45 minute delivery gap, and the previous 100-minute loop
          # held the concurrency group until every subsequent firing was cancelled. So the loop
          # DURATION is not the lever.
          #
          # The measured gap is specifically at the near end: side markets reach T-10m on 0.8% of
          # fixture-market series against the main market's 35.4%, from files deduped the same way,
          # so a 44x difference cannot be explained by dedup. Uniform 5-minute spacing gives 5
          # passes spread across 25 minutes wherever they happen to land, so hitting a given
          # fixture's final ten minutes is chance.
          #
          # Tightening the interval only when a kickoff is imminent concentrates sampling exactly
          # where the gap is, WITHOUT extending the loop — so no concurrency risk and no timeout
          # risk. The script reports NEXT_KO_MIN from the kickoff times it has already fetched, so
          # deciding the cadence costs no extra API calls.
          #
          # Quota impact is small and bounded: the tighter cadence applies only inside the ~40
          # minutes before a kickoff, and only to fixtures already inside the 12h window. The
          # script's own MIN_QUOTA=5000 floor still stops it spending into the tip path.
          echo "NEAR run: fixtures within ${MH}h, adaptive sampling for ${LOOP_MIN}m"
          END=$(( $(date -u +%s) + LOOP_MIN * 60 ))
          i=0
          SLEEP_S=$(( LOOP_EVERY * 60 ))
          while : ; do
            i=$((i + 1))
            echo "--- pass $i  $(date -u '+%H:%M:%S')  (next gap ${SLEEP_S}s) ---"
            # A failed pass must not abandon the remaining window; the script's own quota guard
            # (MIN_QUOTA, now 5,000) is what stops the loop spending into the tip path.
            OUT_TXT=$(python scripts/capture_std_sidemarket_odds_forward.py --max-hours "$MH" 2>&1) \
              || echo "  (pass $i failed - continuing)"
            echo "$OUT_TXT"
            # Nearest kickoff among the fixtures this pass looked at. Absent (no parseable
            # kickoff, or a failed pass) -> keep the default spacing rather than guessing.
            KO_MIN=$(printf '%s\n' "$OUT_TXT" | sed -n 's/^NEXT_KO_MIN=\([0-9][0-9]*\)$/\1/p' | head -1)
            if [ -n "$KO_MIN" ]; then
              if   [ "$KO_MIN" -le 20 ]; then SLEEP_S=120
              elif [ "$KO_MIN" -le 45 ]; then SLEEP_S=180
              else                            SLEEP_S=$(( LOOP_EVERY * 60 ))
              fi
              echo "  nearest kickoff ${KO_MIN}m away -> next pass in ${SLEEP_S}s"
            fi
            NEXT=$(( $(date -u +%s) + SLEEP_S ))
            [ "$NEXT" -lt "$END" ] || break
            sleep "$SLEEP_S"
          done
          echo "completed $i passes over ${LOOP_MIN}m"

      - name: Commit and push updated standard side-market odds history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/standard_sidemarket_odds_history.csv 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: std side-market odds capture $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # NO `-X ours` here. During a rebase `ours` is UPSTREAM, so `-X ours` resolved every
            # push race in favour of whoever pushed first and silently dropped THIS run's rows
            # (verified in a scratch repo: 3 appended rows lost, git reporting "dropping <sha> --
            # patch contents already upstream", workflow still green). With this file declared
            # merge=union in .gitattributes, a plain rebase keeps BOTH sides' appends instead.
            git pull --rebase --autostash origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
