name: World Cup Tracker

on:
  # World Cup 2026 is over — schedule DISABLED 2026-07-13 so it stops auto-running.
  # Kept as workflow_dispatch (manual) so it can be re-enabled for the next tournament (2030).
  workflow_dispatch:

jobs:
  worldcup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run World Cup tracker
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python worldcup/tracker.py
        continue-on-error: true

      - name: Run Telegram (WC alerts)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from telegram_bot.notifier import notify_wc_strong
          w = notify_wc_strong()
          print(f'WC alerts sent: {w}')
          "
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f \
            output/worldcup_tips.csv output/worldcup_history.json \
            output/worldcup_model_tips.csv output/sharp_ledger.csv \
            telegram_bot/wc_notified.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: worldcup $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
