name: Model integrity health (R2)

# R2-C (2026-11-01). Regenerates the shared integrity health artifacts from COMMITTED data only:
#   output/join_integrity_health.json        enrichment joins as served + safe-join replay
#   output/feature_parity_health.json        train/serve parity, every serving model
#   output/nf_feature_parity_health.json     the new-format slice
#   output/price_provenance_health.json      synthetic / mis-mapped price labels vs realised outcomes
#   output/side_edge_devig_health.json       SHADOW de-vigged side edge vs production's 1.08 rule
#   output/side_edge_devig_shadow.csv        append-only first-sight shadow rows
#   output/oddsapi_quota_health.json         OddsAPI credits from run logs (actions:read)
#   output/model_integrity_health.json       per-track aggregator
# READ-ONLY with respect to production: no tip, tier, threshold, stake, ledger, model or Telegram
# message is touched. Every step is non-fatal so one failing check cannot hide the others; a
# failing step is reported as an INFRA warning, never as a model verdict.
# Once daily is enough and may fire hours late (GitHub cron, see CLAUDE.md): each artifact records
# its own generated_at.

on:
  schedule:
    - cron: '20 8 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/integrity_health.yml', 'src/integrity/**', 'scripts/integrity_*.py']
  workflow_dispatch:

concurrency:
  group: integrity-health
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Tests (integrity contracts)
        run: |
          python -m pytest -q tests/test_integrity_joins.py tests/test_integrity_parity.py \
            tests/test_integrity_price_contract.py tests/test_integrity_side_devig.py \
            tests/test_integrity_quota_and_health.py || echo "::warning::integrity contract tests failed (TEST_FAILURE)"
      - name: Join integrity replay (RETROSPECTIVE, offline)
        run: python scripts/integrity_af_join_replay.py --serving --out output/join_integrity_replay.json || echo "::warning::join replay failed (INFRA_FAILURE)"
      - name: Feature parity
        run: python scripts/integrity_feature_parity.py || echo "::warning::feature parity failed (INFRA_FAILURE)"
      - name: Price provenance
        run: python scripts/integrity_price_provenance.py || echo "::warning::price provenance failed (INFRA_FAILURE)"
      - name: Side-market de-vig shadow
        run: python scripts/integrity_side_edge_shadow.py || echo "::warning::side de-vig shadow failed (INFRA_FAILURE)"
      - name: OddsAPI quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python scripts/integrity_oddsapi_quota.py --hours 24 | tee quota.txt || echo "::warning::quota health failed (INFRA_FAILURE)"
          { echo '## OddsAPI quota'; cat quota.txt; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'quota FAIL' quota.txt; then echo "::error title=OddsAPI quota::see output/oddsapi_quota_health.json"; fi
          if grep -q 'quota WARN' quota.txt; then echo "::warning title=OddsAPI quota::see output/oddsapi_quota_health.json"; fi
      - name: Model integrity aggregator
        run: |
          set -o pipefail
          python scripts/integrity_model_health.py | tee mh.txt || echo "::warning::model health failed (INFRA_FAILURE)"
          { echo '## Model integrity'; echo '```'; cat mh.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in output/join_integrity_health.json output/join_integrity_replay.json \
                   output/feature_parity_health.json output/nf_feature_parity_health.json \
                   output/price_provenance_health.json output/side_edge_devig_health.json \
                   output/side_edge_devig_shadow.csv output/oddsapi_quota_health.json \
                   output/model_integrity_health.json; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "auto: integrity health $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
