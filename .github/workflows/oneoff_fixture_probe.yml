name: One-off - API-Football record of fixture 1648307 (2026-11-15)

# Settles the Ireland Premier Division 2026-11-07 score conflict (UCD v Drogheda: football-data 2-1,
# API-Football 1-2): scripts/probe_fixture_record.py on data-truth-100, 2 calls (/fixtures?id and
# /fixtures/events). Manual only. Commits ONLY output/collect/fixture_probe_1648307.json to
# data-truth-100. Delete this file once it has run.
on:
  workflow_dispatch:

concurrency:
  group: oneoff-fixture-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: data-truth-100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas pyarrow
      - name: Probe (2 calls)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          COLLECT_AF_FLOOR: '10000'
        run: |
          python scripts/probe_fixture_record.py 1648307 | tee probe.txt
          { echo '## Fixture 1648307 probe'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the answer to data-truth-100
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp output/collect/fixture_probe_1648307.json "$RUNNER_TEMP/p.json"
          for i in 1 2 3 4 5; do
            git fetch -q origin data-truth-100 && git reset -q --hard origin/data-truth-100
            cp "$RUNNER_TEMP/p.json" output/collect/fixture_probe_1648307.json
            git add -f output/collect/fixture_probe_1648307.json
            git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
            git commit -q -m "data(probe): API-Football record and goal events of fixture 1648307"
            git push origin HEAD:data-truth-100 && exit 0
            sleep $((i * 10))
          done
          echo "::error::could not push"; exit 1
