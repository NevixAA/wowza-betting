name: Update Results

on:
  schedule:
    - cron: '30 7,9,11,13,15,17,19,21,23 * * *'  # every 2h, offset from predict
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python update_results.py --days 3

      # `if: always()` ADDED 2026-09-08, and this is the half of the incident that actually cost
      # data. update_results.py settles FIVE ledgers in sequence — O/U, side markets, HT, player
      # props, sharp — writing each to disk as it finishes. When the props section raised
      # (ValueError on formatting an unpriced row's empty pnl, see update_results.py), the process
      # exited 1 and this step was SKIPPED, so the O/U ledger it had already saved was destroyed
      # with the runner.
      #
      # Measured: 10 consecutive failed runs between 2026-09-06 19:26 and 2026-09-08. The final
      # one had already logged "RESULTS UPDATED — 7 bet(s), PnL +1.490u, CLV +1.46%" and
      # "Ledger saved" before the crash. All of it was thrown away, ten times, while the sections
      # that worked kept working.
      #
      # Safe to commit on failure: each ledger is written with a complete `to_csv`, so a file is
      # either the previous version or a whole new one, never a half-row. And the staging below is
      # per-file with `|| true`, followed by `git diff --staged --quiet ||`, so a run that wrote
      # nothing commits nothing rather than creating an empty commit.
      #
      # This is the same lesson as v9's predict committing each output file individually, and as
      # pro_bet_builder.yml omitting `git add -A data`: work completed and then discarded is the
      # failure mode this estate keeps repeating.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in output/bets_ledger.csv output/side_bets_ledger.csv output/ht_ledger.csv output/player_ledger.csv output/sharp_ledger.csv output/live_signals_history.csv; do git add -f "$f" 2>/dev/null || true; done
          git diff --staged --quiet || \
            git commit -m "auto: results $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
