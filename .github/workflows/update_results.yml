name: Update Results

on:
  schedule:
    - cron: '30 7,9,11,13,15,17,19,21,23 * * *'  # every 2h, offset from predict
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # +5 for the shadow settlement pass + its own commit step (2026-10-20); +5 league research panel (2026-10-25)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # Shadow settlements are journalled here and re-applied in their own commit step
          # below (see "Commit shadow settlement"). Outside the repo, so no reset can lose it.
          SHADOW_SETTLEMENT_JOURNAL: ${{ runner.temp }}/shadow_settlement.json
        run: python update_results.py --days 3

      # `if: always()` ADDED 2026-09-08, and this is the half of the incident that actually cost
      # data. update_results.py settles FIVE ledgers in sequence — O/U, side markets, HT, player
      # props, sharp — writing each to disk as it finishes. When the props section raised
      # (ValueError on formatting an unpriced row's empty pnl, see update_results.py), the process
      # exited 1 and this step was SKIPPED, so the O/U ledger it had already saved was destroyed
      # with the runner.
      #
      # Measured: 10 consecutive failed runs between 2026-09-06 19:26 and 2026-09-08. The final
      # one had already logged "RESULTS UPDATED — 7 bet(s), PnL +1.490u, CLV +1.46%" and
      # "Ledger saved" before the crash. All of it was thrown away, ten times, while the sections
      # that worked kept working.
      #
      # Safe to commit on failure: each ledger is written with a complete `to_csv`, so a file is
      # either the previous version or a whole new one, never a half-row. And the staging below is
      # per-file with `|| true`, followed by `git diff --staged --quiet ||`, so a run that wrote
      # nothing commits nothing rather than creating an empty commit.
      #
      # This is the same lesson as v9's predict committing each output file individually, and as
      # pro_bet_builder.yml omitting `git add -A data`: work completed and then discarded is the
      # failure mode this estate keeps repeating.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The shadow log is committed by the NEXT step, not this one. Drop this run's local
          # edit of it here so the rebase below never has to merge it (the journal holds it).
          git checkout -- output/v91_shadow.csv 2>/dev/null || true
          git checkout -- output/shadow_settlement_health.json 2>/dev/null || true
          git checkout -- output/clv_collection_health.json 2>/dev/null || true
          for f in output/bets_ledger.csv output/side_bets_ledger.csv output/ht_ledger.csv output/ht_observations.csv output/player_ledger.csv output/sharp_ledger.csv output/live_signals_history.csv; do git add -f "$f" 2>/dev/null || true; done
          git diff --staged --quiet || \
            git commit -m "auto: results $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }

      # P0 2026-10-20 — settle the prospective shadow log (output/v91_shadow.csv).
      #
      # WHY A SEPARATE STEP, AND WHY NOT `pull --rebase -X theirs` FOR THIS ONE FILE. The ledgers
      # above have one writer; v91_shadow.csv has TWO: predict APPENDS rows every 5-15 minutes,
      # this job EDITS rows in place. When predict's appended lines sit next to a row this run
      # settled, git reports a conflict and `-X theirs` keeps this run's side of the hunk —
      # silently deleting predict's new rows. A deleted row is then re-logged by predict at a
      # LATER time, i.e. the first-sight freeze is broken without anyone noticing.
      #
      # So this step never merges. Each attempt resets to the freshest origin/main, re-applies
      # this run's settlements from the journal onto THAT file (offline, idempotent, fills only
      # blank grading cells; first-sight columns are hashed and the write is refused if they
      # change), stages the two files individually, and pushes. A lost race just retries.
      #
      # The reverse race is benign: if predict's own `-X theirs` rebase reverts a settled cell,
      # the row is blank again and the next run re-settles it with the same values.
      - name: Commit shadow settlement
        if: always()
        env:
          SHADOW_SETTLEMENT_JOURNAL: ${{ runner.temp }}/shadow_settlement.json
        run: |
          [ -f "$SHADOW_SETTLEMENT_JOURNAL" ] || { echo "no shadow journal - nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main || { sleep 3; continue; }
            python update_results.py --shadow-reapply "$SHADOW_SETTLEMENT_JOURNAL"
            # Prospective experiments (H-MODEL-01): RESULTS only, joined from the v91 rows just
            # settled above. Deterministic from the files on disk, so a retry re-derives it.
            python -m src.shadow_experiments settle || true
            python -m src.shadow_experiments evaluate > /dev/null || true
            for f in output/v91_shadow.csv output/shadow_settlement_health.json \
                     output/clv_collection_health.json \
                     output/model_lineage/shadow_experiments.csv \
                     output/model_lineage/shadow_experiments_eval.json; do
              git add -f "$f" 2>/dev/null || true
            done
            if git diff --staged --quiet; then pushed=1; echo "shadow: nothing new"; break; fi
            git commit -q -m "auto: shadow settlement $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "shadow settlement push failed after 5 retries"; exit 1; }

      # WEEKLY LEAGUE RESEARCH PANEL SETTLEMENT (2026-10-25). RESEARCH ONLY. Fills the grading columns of
      # output/league_weekly_research.csv (score from the v91 rows settled above, certified T-30m closes from
      # the ledgers' archives + heartbeats); frozen columns are hashed and the write is refused if one would
      # change. Same no-merge discipline as the shadow step: predict APPENDS to this file, so each attempt
      # resets to the freshest origin/main and re-derives the settlement from the files on disk
      # (deterministic, idempotent). TOLERANT: a failure is a warning, never a red run.
      - name: Settle weekly league research panel (research only)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main || { sleep 3; continue; }
            python -m src.research.league_weekly settle || { echo "::warning::league research settlement failed (research only)"; pushed=1; break; }
            for f in output/league_weekly_research.csv output/league_weekly_research.csv.first_sight.json \
                     output/league_weekly_research_summary.json output/league_market_health.json \
                     output/weekly_league_report.json; do
              git add -f "$f" 2>/dev/null || true
            done
            if git diff --staged --quiet; then pushed=1; echo "league research: nothing new"; break; fi
            git commit -q -m "auto: league research settlement $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || echo "::warning::league research settlement push failed after 5 retries"

      # P0 2026-10-22 - FAIL LOUDLY if a registered challenger experiment is not being logged.
      # The H-MODEL-01 clock ran for 18 days with zero challenger probabilities and nothing went
      # red. Runs after every commit, so a failure here never costs data.
      - name: Guard - registered experiments must be logging
        if: always()
        run: python -m src.shadow_experiments guard

      # CLV COLLECTION GUARD (P1 2026-10-22). Runs LAST, after both commits, so a failing guard can
      # never stop results or settlements from persisting. It turns the run red when certified
      # T-30m close coverage falls below config/clv_collection_expectation.json - the failure that
      # sat unnoticed for weeks (34 of 449 settled shadow rows had a certified close).
      - name: CLV collection health guard
        if: always()
        run: |
          git fetch -q origin main && git checkout -q origin/main -- output/clv_collection_health.json config/clv_collection_expectation.json 2>/dev/null || true
          python scripts/check_clv_collection_health.py
