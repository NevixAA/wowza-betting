name: Data Truth Collect (real data)

# Owner decision C (2026-11-02): collect the REAL data the props features and the measured club
# strength need, instead of inventing it. Resumable and journaled: every collector skips what is
# already stored, so a run that stops (budget, timeout) loses nothing and the next run continues.
#
#   1. scripts/collect_competition_fixtures.py  API-Football /fixtures?league&season for every
#      registry club league and club cup + the continental cups (Libertadores, Sudamericana,
#      AFC / CONCACAF Champions League, Club World Cup): 1 call per competition-season
#   2. scripts/collect_af_history_gap.py        the af_history.parquet gap (2025 calendar-year
#      seasons of the new-format leagues), via scripts/backfill_af_history.py
#   3. scripts/collect_sidelined.py             /sidelined?player for every player without one
#   4. scripts/collect_player_profiles.py       /players?id&season for every (player, season) in
#      player_history without a stored profile (height, weight, birth date, season penalties)
#   5. scripts/collect_understat_shots.py       Understat shots + rosters (no API-Football call)
#   6. python -m src.strength.build             refit the measured club / league strength
#   7. scripts/collect_ht_scores.py             API-Football /fixtures?league&season for every
#      new-format league-season whose output/fd_history.parquet matches lack a half-time score
#      (1 call per league-season: 120 on the 2026-11-02 history); the half-time scores are written
#      BESIDE the history (output/collect/fd_history_ht_fill.parquet + ht_fill_audit.json)
#   8. scripts/collect_cup_player_stats.py     API-Football /fixtures/players for every UEFA cup
#      fixture (Champions / Europa / Conference League, ids 2 / 3 / 848) in the span player_history
#      covers: 1 call per fixture (3,779 on the 2026-11-02 fixture list, then only newly finished
#      ones), written BESIDE the history to output/collect/cup_player_rows.parquet (serving reads it
#      at once; python -m player_model.pipeline --mode merge-cups appends it to player_history)
#   9. scripts/collect_af_history_gap.py --insidebox  API-Football 'Shots insidebox' (+ xG from the
#      same response) for every af_history row without it, ALL leagues: fixture ids from step 1's
#      fixture lists (no call), /leagues?id coverage (1 call per league, journaled; seasons without
#      provider statistics are skipped), then /fixtures/statistics 1 call per fixture not already in
#      scripts/af_history_cache/ or the journal (output/collect/af_fixture_stats.parquet). Written
#      BESIDE af_history.parquet: output/collect/af_history_stats_fill.parquet + af_stats_fill_audit.json
#  11-14. History that was fetched live only and never stored (owner decision 2026-11-04, "if it is
#      100% real data, yes"), all from step 1's fixture lists, all journaled in output/collect/:
#  11. scripts/collect_injuries.py   /injuries?league&season, 1 call per registry league-season (412
#      on the 2026-11-04 fixture lists) + /leagues?id coverage (47); per fixture only for a
#      league-season whose answer is incomplete
#  12. scripts/collect_coaches.py    /coachs?team, 1 call per team id in the fixture lists (1,645),
#      then once more per team after each transfer-window close (2 Sep / 3 Feb; owner 2026-11-04)
#  13. scripts/collect_transfers.py  /transfers?team, 1 call per team id (1,645), same refresh
#  14. scripts/collect_lineups.py    /fixtures/lineups?fixture, 1 call per finished registry fixture,
#      newest first (at most 119,058; seasons the provider flags without lineups are skipped);
#      stored one file per league-season under output/collect/lineups/ (never near 100 MB)
#  15. scripts/collect_player_refetch.py  /fixtures/players?fixture again for every fixture behind
#      player_history + the UEFA cup rows whose identity the fixture lists prove (32,724 on
#      2026-11-04; 247 national-team fixtures are not in the lists and are refused), newest first.
#      Owner 2026-11-04: AFTER lineups. The counts are stored under the owner's null rule BESIDE the
#      history (output/collect/player_history_refetch.parquet + player_history_refetch_audit.json)
#
# API-FOOTBALL BUDGET (scripts/collect_common.py, checked before EVERY call): this job may spend at
# most 45,000 calls per UTC day (journal output/collect/af_budget.json, committed) and stops as soon
# as the account's x-ratelimit-requests-remaining is below 25,000 (plan 75,000/day; normal use is
# up to ~23,300/day). A budget stop is a clean exit 0; the next run continues.
#
# TRIGGER: a push to data-truth-100 that changes .github/collect_trigger.txt, or workflow_dispatch.
# Not scheduled: the lead starts each run-day.

on:
  push:
    branches: [data-truth-100]
    paths: ['.github/collect_trigger.txt']
  workflow_dispatch:
    inputs:
      steps:
        description: 'Comma list of steps to run (fixtures,htscores,cupstats,afgap,insidebox,fullstats,sidelined,profiles,injuries,coaches,transfers,lineups,playerrefetch,strength)'
        required: false
        default: 'fixtures,htscores,cupstats,afgap,insidebox,fullstats,sidelined,profiles,injuries,coaches,transfers,lineups,playerrefetch,strength'

concurrency:
  group: data-truth-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      STEPS: ${{ github.event.inputs.steps || 'fixtures,htscores,cupstats,afgap,insidebox,fullstats,sidelined,profiles,injuries,coaches,transfers,lineups,playerrefetch,strength' }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: data-truth-100

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The per-fixture statistics of the af_history gap are cached permanently by
      # backfill_af_history; restoring them lets a budget-stopped league finish for free.
      - name: Cache AF history fixture cache
        uses: actions/cache@v4
        with:
          path: scripts/af_history_cache
          key: af-history-${{ github.run_id }}
          restore-keys: af-history-

      - name: Commit helper
        run: |
          cat > /tmp/commit_collected.sh <<'EOF'
          #!/usr/bin/env bash
          # Commit whatever the collectors stored so far and push it to data-truth-100.
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/collect output/strength output/af_history.parquet 2>/dev/null || true
          # the owner's history corrections (step 7), on their own line: a missing path must not
          # make git add skip the collected data above
          git add -f output/corrections/history_*.csv output/corrections/history_corrections_audit.json 2>/dev/null || true
          git add -f output/corrections/player_history_invalid_profile_keys.csv 2>/dev/null || true
          # the owner's af_history duplicate rule (fix14/afdupes), rebuilt before steps 9 and 10
          git add -f output/corrections/af_history_removed_duplicates.csv output/corrections/af_history_duplicate_conflicts.csv 2>/dev/null || true
          if git diff --staged --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -q -m "auto: data truth collect ($1) $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            # In a rebase `-X theirs` keeps THIS run's commit (the collected data).
            git pull --rebase --autostash -X theirs origin data-truth-100 && \
              git push origin HEAD:data-truth-100 && exit 0
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          echo "push failed after 5 retries"; exit 1
          EOF
          chmod +x /tmp/commit_collected.sh

      - name: 1. Cross-league competition fixtures
        if: contains(env.STEPS, 'fixtures')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_competition_fixtures.py
          /tmp/commit_collected.sh fixtures

      # Runs second: ~120 calls, so the HT gap is closed before the large budget consumers.
      # Owner decisions 2026-11-04: (a) build_history_corrections first - the proven duplicate rows
      # (no call) and the proven domestic-cup rows (national cup fixture lists, a few calls, at most
      # 40) that the HT matcher and the loader leave out; (b) --add-ft stores the provider FT beside
      # the HT fill (from step 1's fixture lists, else one re-read per league-season still lacking it,
      # ~120 at most, resumable) and refuses fill rows whose provider FT differs from the history FT.
      # fix9/defaults (owner 2026-11-04): --add-status FIRST re-reads each of the 120 stored league-season
      # lists ONCE (journal output/collect/ht_status_seasons.parquet, resumable, budget-guarded) to store
      # score.extratime / score.penalty and the AWD / WO / ABD statuses the 2026-11-02 parse dropped, so
      # build_history_corrections can exclude awarded / abandoned matches from the whole history.
      # fix10 (owner 2026-11-04): --status-all-leagues extends that re-read to every other registry
      # league-season of step 1's fixture lists, so awarded and abandoned matches are detected in the
      # STANDARD-league history too: 388 lists on 2026-11-04 (120 HT lists + 268 registry
      # league-seasons; `collect_ht_scores.py --add-status --status-all-leagues --dry-run` prints the
      # count), 1 call each, ONCE per league-season. Budget-guarded by AFClient (job cap and account
      # floor checked before every call; a stop is a clean exit) and resumable: each list read is
      # journaled in output/collect/ht_status_seasons.parquet and never asked again.
      - name: 7. Half-time scores for the new-format history
        if: contains(env.STEPS, 'htscores')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_ht_scores.py --add-status --status-all-leagues
          python scripts/build_history_corrections.py --fetch
          python scripts/collect_ht_scores.py --add-ft
          /tmp/commit_collected.sh htscores

      # Runs third: ~3,800 calls on the first run, then only newly finished cup fixtures. Needs
      # step 1's fixture list (output/strength/competition_fixtures.parquet).
      - name: 8. UEFA cup player stats per fixture
        if: contains(env.STEPS, 'cupstats')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_cup_player_stats.py
          /tmp/commit_collected.sh cupstats

      - name: 2. af_history gap
        if: contains(env.STEPS, 'afgap')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_af_history_gap.py
          /tmp/commit_collected.sh afgap

      - name: 3. Sidelined history per player
        if: contains(env.STEPS, 'sidelined')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_sidelined.py
          /tmp/commit_collected.sh sidelined

      - name: 4. Player profiles per season
        if: contains(env.STEPS, 'profiles')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # fix10 (owner 2026-11-04): the history rows behind the keys never sent (player id 0, no
          # PROVIDER season) are rewritten beside the history each run, so a pair made valid by a
          # provider season recorded by collect-wc (output/collect/national_fixture_seasons.csv)
          # leaves the list.
          python scripts/collect_player_profiles.py \
            --invalid-keys-out output/corrections/player_history_invalid_profile_keys.csv
          /tmp/commit_collected.sh profiles

      # LAST of the API-Football steps (2026-11-03): it is the largest (~54k calls) and lower priority
      # than the player profiles the props retrain needs; on run-day 2 it ran first and spent the whole
      # job cap before profiles started. After the af_history gap (its new rows carry HIB already) and
      # step 1 (the fixture lists it reads ids from). Budget-guarded; a budget stop is resumable.
      - name: 9. Inside-box shots for af_history (all leagues)
        if: contains(env.STEPS, 'insidebox')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          # owner 2026-11-04 duplicate rule for af_history (fix14/afdupes, 0 calls): the copy of a
          # provider fixture filed one day off the provider's date is removed in the read, so the kept
          # copy is matched alone instead of both being refused as "claimed by two dates"
          python scripts/build_af_history_corrections.py || echo "::warning::af_history corrections not rebuilt - the committed list stays in force"
          python scripts/collect_af_history_gap.py --insidebox
          /tmp/commit_collected.sh insidebox

      # 11-14 (owner 2026-11-04): after profiles and insidebox, which the props retrain needs first.
      # Smallest first; lineups (~119k calls) LAST of the API-Football steps so it never starves the
      # others (the run-day-2 lesson of step 9). Each is budget-guarded and resumable; a budget stop
      # in one step leaves the next steps to stop at once on the same cap, at no cost.
      - name: 11. Injuries history per league-season
        if: contains(env.STEPS, 'injuries')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_injuries.py
          /tmp/commit_collected.sh injuries

      - name: 12. Coach careers per team
        if: contains(env.STEPS, 'coaches')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_coaches.py
          /tmp/commit_collected.sh coaches

      - name: 13. Transfers per team
        if: contains(env.STEPS, 'transfers')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_transfers.py
          /tmp/commit_collected.sh transfers

      - name: 14. Lineups per finished fixture
        if: contains(env.STEPS, 'lineups')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_lineups.py
          /tmp/commit_collected.sh lineups

      # Owner 2026-11-04 (fix round 8): AFTER lineups. player_history (and the UEFA cup rows) hold 0
      # for every null the provider sent; one /fixtures/players re-read per proven fixture stores the
      # counts under the owner's null rule beside the history. Budget-guarded, journaled, resumable.
      - name: 15. Player history re-fetch (null rule)
        if: contains(env.STEPS, 'playerrefetch')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python scripts/collect_player_refetch.py
          /tmp/commit_collected.sh playerrefetch

      # 0 API calls (owner 2026-11-04): every statistic of the /fixtures/statistics answers already in
      # scripts/af_history_cache (shots off goal, offsides, passes, saves, ...), placed by team id,
      # a value the provider does not give stays missing. No key on purpose: it cannot call the API.
      # After step 9 so the answers it fetched today are included; runs after a budget stop too.
      - name: 10. All cached fixture statistics for af_history (no API call)
        if: always() && contains(env.STEPS, 'fullstats')
        run: |
          python scripts/build_af_history_corrections.py || echo "::warning::af_history corrections not rebuilt - the committed list stays in force"
          python scripts/collect_af_history_gap.py --fullstats
          /tmp/commit_collected.sh fullstats

      # 5. Understat: REMOVED (owner 2026-11-02). Understat data is free for non-commercial use only and
      #    Wowza is commercial; no collection until Understat grants written commercial permission
      #    (then restore this step and set player_model/setpiece/features.UNDERSTAT_COMMERCIAL_LICENCE).

      - name: 6. Measured club / league strength
        if: always() && contains(env.STEPS, 'strength')
        run: |
          python -m src.strength.build
          /tmp/commit_collected.sh strength
