name: Player Props

on:
  schedule:
    # Run 30 min after each predict run (gives time for bets.csv to update)
    - cron: '30 6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  player_props:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect player data (FBref - runs every Sunday 06:30 UTC)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && startsWith(github.event.schedule, '30 6') && contains(github.event.schedule, '* * 0'))
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode collect
        continue-on-error: true

      - name: Train player models (if history exists)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode train
        continue-on-error: true

      - name: Generate player prop predictions
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m player_model.pipeline --mode predict

      - name: Send Telegram alerts for player prop signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from telegram_bot.notifier import notify_player_props
          sent = notify_player_props()
          print(f'Player prop alerts sent: {sent}')
          "
        continue-on-error: true

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/player_tips.csv telegram_bot/notified.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: player props $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
