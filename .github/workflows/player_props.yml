name: Player Props

# Prevent overlapping runs — wait for the previous run to finish before starting the next.
# This is critical for player_notified.json consistency (no duplicate alerts).
concurrency:
  group: player-props
  cancel-in-progress: false

on:
  schedule:
    # Predict-only: every hour at :02 (24/7 during WC, night skipped after Jul 19)
    #
    # WEEKEND WEIGHTING (2026-08-29). Hourly was flat across the week while the fixtures are not:
    # measured on 414 unique fixtures, Fri-Sun carries 327 of them (79.0%) — 109/day against
    # 22/day Mon-Thu. Sampling a Tuesday as often as a Saturday spends the scheduler where there
    # is nothing to price.
    #
    # Cadence matters MORE for props than for team markets, because a prop price is not simply
    # sitting there waiting: coverage is per fixture, markets are posted late and DEEPEN toward
    # kickoff (Hull v Man United carried only anytime-scorer 7 days out; Espanyol v Levante
    # carried all 6 markets at 3 days), which is why the empty-response TTL already scales with
    # time to kickoff. Opening -> moving -> closing can only be observed by sampling inside that
    # final window, and it CANNOT be backfilled — a closing price not captured is gone.
    # So the extra firings go in the Fri-Sun daytime window, where the kickoffs actually are.
    #
    # HALF-HOURLY, NOT FINER, AND DELIBERATELY CONSERVATIVE. This group serialises
    # (cancel-in-progress: false) and GitHub keeps one pending run per group, so an interval
    # under the run time queues and then gets dropped — the failure predict.yml was just fixed
    # for. Props runtime is NOT measured here (no authenticated gh in the shell this was written
    # in), so 30 min is chosen to leave roughly 2x headroom on a plausible run length rather than
    # tuned to a number. IF props runs start queueing or delivery drops on Fri-Sun, this goes
    # back to hourly first — verify against real workflow runs, not local checks.
    # REVERTED 2026-08-29, hours after adding it. The half-hourly Fri-Sun window was reasoned from
    # where the fixtures are (Fri-Sun carries 79% of them) while ignoring what actually limits
    # delivery. The repo was asking for 696 scheduled runs on a Saturday and GitHub was honouring
    # about 4%; this workflow received 2 runs in 12 hours against ~12 requested. Adding 14 more
    # firings a day to a workflow already being dropped makes it less likely to run, not more.
    # Back to hourly everywhere — 24/day, and the weekend question gets revisited only once
    # delivery is healthy enough to measure the difference.
    - cron: '2 * * * *'
    # WC retrain: nightly at 23:30 UTC (after all WC matches finish)
    - cron: '30 23 * * *'
    # Full club-league retrain: every Sunday at 05:00 UTC
    - cron: '0 5 * * 0'
    # DAILY collect, Mon-Sat 05:00 UTC (added 2026-08-16). player_history.parquet is the
    # player-side equivalent of af_history.parquet, and it was only ever extended on the
    # Sunday run — so it sat 43 days stale, which is why clv_records.result was 100% empty
    # and props CLV could not grade at all. Same principle as af_history_extend: keep the
    # committed history within a day of live. Sunday keeps the retrain; these days collect only.
    - cron: '0 5 * * 1-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'predict'
        type: choice
        options: [predict, collect_train_predict]

jobs:
  player_props:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # predict enrichment can exceed 60m on a full slate; give it room to finish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache fixture stats (API-Football corner data)
        uses: actions/cache@v4
        with:
          path: fixture_stats_cache
          # run_id key (not hashFiles) so a data_fetcher.py edit doesn't ORPHAN the whole
          # accumulated cache -> cold start -> thousands of re-fetches -> Sunday collect
          # times out (bug 2026-07-05). Matches the other caches; stats are permanent.
          key: fixture-stats-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fixture-stats-${{ runner.os }}-

      - name: Cache lineup data (4h TTL — pre-match lineups)
        uses: actions/cache@v4
        with:
          path: lineup_cache
          key: lineup-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lineup-${{ runner.os }}-

      - name: Cache player prop odds
        uses: actions/cache@v4
        with:
          path: prop_odds_cache
          key: prop-odds-${{ runner.os }}-${{ github.run_id }}
          restore-keys: prop-odds-${{ runner.os }}-

      - name: Cache fixture player stats (permanent — only new fixtures cost API calls)
        uses: actions/cache@v4
        with:
          path: fixture_player_cache
          key: fixture-player-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fixture-player-${{ runner.os }}-

      # Is the training history actually stale? Collect is gated on DATA FRESHNESS, not only
      # on a cron string.
      #
      # Why: collect used to run only when github.event.schedule matched '0 5 * * 1-6' or
      # '0 5 * * 0'. That value holds whichever cron fired, so on the hourly '2 * * * *' runs
      # collect is correctly skipped — but it meant a single missed or undelivered 05:00 run
      # silently cost a whole day of collection. player_history.parquet sat at 2026-07-04 with
      # ZERO rows after it while props predict ran hourly and reported success, which blocked
      # every prop CLV grade, left summer transfers resolving to old clubs (Aubameyang still
      # showing as Marseille), and starved the PL/Serie A squads that OddsAPI was pricing.
      #
      # Freshness is the thing we actually care about, so gate on it directly: any hourly run
      # will pick the collect up within the hour if history has fallen behind. A collect that
      # keeps failing now retries visibly instead of waiting a day, and its outcome is recorded
      # in output/props_health.json either way.
      - name: Check training-history freshness
        id: freshness
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          from pathlib import Path
          stale, newest, age = "true", "missing", 9999
          try:
              import pandas as pd
              p = Path("player_history.parquet")
              if p.exists():
                  d = pd.read_parquet(p, columns=["date"])
                  newest = str(pd.to_datetime(d["date"]).max())[:10]
                  age = (dt.date.today() - dt.date.fromisoformat(newest)).days
                  stale = "true" if age > 2 else "false"
          except Exception as e:
              print(f"# freshness check failed ({e}) -> assuming stale")
          print(f"stale={stale}")
          print(f"newest={newest}")
          print(f"age_days={age}")
          PY
          echo "history newest=$(grep '^newest=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
        continue-on-error: true

      # Collect now lives in .github/workflows/player_history_extend.yml, which owns
      # player_history.parquet and has its own concurrency group.
      #
      # It ran here until 2026-08-18 and cost tips: a full collect takes ~60 minutes and held
      # the `player-props` group for the duration, so the hourly predict could not run. Run
      # #914 (dispatch) blocked #915 — cancelled — and #916 — queued. Gating it on freshness
      # made that worse rather than better, because "newest match older than 2 days" is
      # legitimately true between rounds, so an hourly workflow would have launched an
      # hour-long collect every hour.
      #
      # Kept here for EXPLICIT manual dispatch only, as an escape hatch. The freshness step
      # above still runs and still records the numbers in props_health.json, so staleness stays
      # visible from this workflow even though it no longer acts on it.
      - name: Collect club league data (manual dispatch only — see player_history_extend.yml)
        id: collect_club
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect_train_predict'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode collect
        continue-on-error: true

      - name: Collect WC2026 national team data (nightly during WC, Sundays, manual)
        id: collect_wc
        if: |
          github.event.schedule == '30 23 * * *' ||
          github.event.schedule == '0 5 * * 0' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect_train_predict')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          # A MANUAL run ignores the tournament window. The window is right for the cron
          # (don't burn API quota on WC endpoints year-round), but it also made backfilling
          # impossible: WC player stats stopped landing in player_history.parquet on
          # 2026-07-04 while the tournament ran to 07-26, so 20 settled prop bets from the
          # knockout rounds can never be graded — and after 07-26 even a manual dispatch
          # skipped this step. workflow_dispatch now forces it so the gap can be filled.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — collecting WC national team data regardless of date."
            python -m player_model.pipeline --mode collect-wc --last-n 10
          elif [ "$TODAY" -ge "20260611" ] && [ "$TODAY" -le "20260726" ]; then
            echo "WC2026 active — collecting national team data..."
            python -m player_model.pipeline --mode collect-wc --last-n 10
          else
            echo "Outside WC2026 window ($TODAY), skipping collect-wc."
          fi
        continue-on-error: true

      - name: Train player models (nightly during WC, Sundays, manual)
        if: |
          github.event.schedule == '30 23 * * *' ||
          github.event.schedule == '0 5 * * 0' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect_train_predict')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          if [ "$TODAY" -ge "20260611" ] && [ "$TODAY" -le "20260726" ]; then
            python -m player_model.pipeline --mode train
          else
            # Outside WC — only train on Sundays
            if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python -m player_model.pipeline --mode train
            else
              echo "Outside WC2026 window, skipping nightly train."
            fi
          fi
        continue-on-error: true

      # The collect steps are continue-on-error so a bad collect can't block predict. That is
      # the right call, but it also made failure INVISIBLE: player_history.parquet quietly
      # stopped advancing on 2026-07-04 while bets ran to 08-17, and the only symptom was
      # clv_records.result staying empty. This step turns both failure modes into GitHub
      # annotations. It never fails the job.
      - name: Report collect health (parquet freshness)
        if: always()
        run: |
          echo "collect(club) outcome : ${{ steps.collect_club.outcome }}"
          echo "collect(wc)   outcome : ${{ steps.collect_wc.outcome }}"
          if [ "${{ steps.collect_club.outcome }}" = "failure" ]; then
            echo "::error title=Player collect failed::--mode collect failed. player_history.parquet will not advance, so prop CLV records cannot grade."
          fi
          if [ "${{ steps.collect_wc.outcome }}" = "failure" ]; then
            echo "::error title=WC collect failed::--mode collect-wc failed."
          fi
          python - <<'PY'
          import datetime as dt
          from pathlib import Path
          try:
              import pandas as pd
              p = Path("player_history.parquet")
              if not p.exists():
                  print("::error title=No player history::player_history.parquet is missing")
              else:
                  d = pd.read_parquet(p, columns=["date"])
                  mx = str(pd.to_datetime(d["date"]).max())[:10]
                  age = (dt.date.today() - dt.date.fromisoformat(mx)).days
                  print(f"player_history.parquet newest match: {mx}  ({age} days old)")
                  if age > 14:
                      print(f"::warning title=Stale player history::newest match is {mx}, "
                            f"{age} days old - collect is not advancing and prop CLV cannot grade")
          except Exception as e:
              print(f"::warning title=Freshness check failed::{e}")
          PY
        continue-on-error: true

      - name: Generate player prop predictions
        id: predict_props
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          SCHEDULE="${{ github.event.schedule }}"
          # Skip night runs outside WC window
          if [[ "$SCHEDULE" == *"0-7"* ]] && [ "$TODAY" -gt "20260719" ]; then
            echo "Outside WC2026 — skipping night predict"
            exit 0
          fi
          # Tee to a log so the health step below can commit the tail. Without a valid API
          # token the run logs are unreadable from outside CI, and this workflow has reported
          # SUCCESS on every hourly run since 2026-08-15 while player_tips.csv never changed.
          # Committed evidence beats log archaeology.
          set -o pipefail
          python -m player_model.pipeline --mode predict 2>&1 | tee /tmp/props_predict.log
        continue-on-error: true

      - name: Send Telegram alerts for player prop signals
        id: notify_props
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from telegram_bot.notifier import notify_player_props, notify_lineup_cashout
          sent = notify_player_props()
          cashout = notify_lineup_cashout()
          print(f'Player prop alerts sent: {sent}  |  Cashout alerts: {cashout}')
          "
        continue-on-error: true

      # Why this exists: player_props has reported SUCCESS on every hourly run since
      # 2026-08-15 14:29 while output/player_tips.csv was never committed. Every step shows
      # ok, including the predict step's pre-continue-on-error `outcome`. Run logs are not
      # readable without a valid token, so this records what actually happened INTO A
      # COMMITTED FILE. Cheap, permanent, and needs no credential to read.
      - name: Record props health (observable without log access)
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess, datetime
          h = {
              "checked_at": datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "run_number": os.getenv("GITHUB_RUN_NUMBER"),
              "event": os.getenv("GITHUB_EVENT_NAME"),
              "schedule": os.getenv("PROPS_SCHEDULE", ""),
              "sha": (os.getenv("GITHUB_SHA") or "")[:12],
              "history_freshness": {
                  "newest_match": "${{ steps.freshness.outputs.newest }}",
                  "age_days": "${{ steps.freshness.outputs.age_days }}",
                  "stale": "${{ steps.freshness.outputs.stale }}",
              },
              "step_outcomes": {
                  "collect_club": "${{ steps.collect_club.outcome }}",
                  "predict": "${{ steps.predict_props.outcome }}",
                  "notify": "${{ steps.notify_props.outcome }}",
              },
          }
          try:
              import pandas as pd
              for f in ("output/player_tips.csv", "output/player_ledger.csv"):
                  try:
                      d = pd.read_csv(f, dtype=str)
                      h[f] = {
                          "rows": len(d),
                          "fixtures": int(d["match"].nunique()) if "match" in d else None,
                          "mtime": datetime.datetime.utcfromtimestamp(
                              os.path.getmtime(f)).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      }
                  except Exception as e:
                      h[f] = {"error": f"{type(e).__name__}: {e}"}
          except Exception as e:
              h["pandas_error"] = str(e)
          # Did git actually see a change? This is the question the last two days hinged on.
          try:
              h["git_dirty_outputs"] = subprocess.run(
                  ["git", "status", "--porcelain", "output", "player_history.parquet"],
                  capture_output=True, text=True, timeout=60).stdout.strip().splitlines()
          except Exception as e:
              h["git_dirty_outputs"] = [f"error: {e}"]
          # Tail of the predict run — the actual missing evidence.
          try:
              with open("/tmp/props_predict.log", encoding="utf-8", errors="replace") as fh:
                  h["predict_log_tail"] = fh.read().splitlines()[-40:]
          except Exception as e:
              h["predict_log_tail"] = [f"no log: {e}"]
          os.makedirs("output", exist_ok=True)
          with open("output/props_health.json", "w", encoding="utf-8") as fh:
              json.dump(h, fh, indent=2)
          print(json.dumps({k: v for k, v in h.items()
                            if k != "predict_log_tail"}, indent=2))
          PY
        continue-on-error: true

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each file INDIVIDUALLY. `git add -f a b missing` validates every pathspec
          # first and ABORTS, staging NOTHING — and `2>/dev/null || true` then hides it. Two
          # of the paths below (telegram_bot/player_kickoff_cache.json, team_id_cache.json)
          # do not exist in the repo, so from 2026-08-15 14:29 to 2026-08-18 this staged
          # nothing on EVERY hourly run: no commit, no error, and ten consecutive green runs
          # while player_tips.csv stayed frozen. Confirmed by experiment: one missing
          # pathspec => 0 files staged.
          #
          # predict.yml was already fixed this way (its comment cites the same bug causing
          # the duplicate Telegram-tip flood); the fix was never carried over to this file.
          # Missing paths are kept in the list on purpose — a loop skips them harmlessly and
          # picks them up automatically if they are ever created.
          for f in output/player_tips.csv output/player_ledger.csv \
                   output/player_prop_odds_history.csv output/clv_records.csv \
                   output/prop_odds_coverage.json output/props_health.json \
                   telegram_bot/player_notified.json telegram_bot/cashout_notified.json \
                   telegram_bot/player_kickoff_cache.json team_id_cache.json \
                   player_history.parquet \
                   models/model_player_goals.pkl   models/model_player_goals2.pkl \
                   models/model_player_assists.pkl \
                   models/model_player_sot.pkl     models/model_player_sot2.pkl \
                   models/model_player_sot3.pkl    models/model_player_cards.pkl; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: player props $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }

      # Every functional step above is continue-on-error so one failure cannot stop the
      # others' outputs from being committed. That is the right trade, but the cost was that
      # a broken predict produced a GREEN run with no commit at all: player_tips.csv sat
      # unchanged from 2026-08-15 14:29 to 2026-08-17 and nothing ever surfaced it. The
      # existing health step only emits annotations, which nobody reads.
      #
      # This runs AFTER the commit, so outputs are still saved, but the job goes RED when a
      # step actually failed — which is visible in the Actions list and triggers GitHub's
      # failure notification.
      - name: Fail the run if a functional step failed
        if: always()
        run: |
          fail=0
          for pair in "collect_club:${{ steps.collect_club.outcome }}" \
                      "collect_wc:${{ steps.collect_wc.outcome }}" \
                      "predict:${{ steps.predict_props.outcome }}" \
                      "notify:${{ steps.notify_props.outcome }}"; do
            name="${pair%%:*}"; outcome="${pair#*:}"
            echo "${name} -> ${outcome:-skipped}"
            if [ "$outcome" = "failure" ]; then
              echo "::error title=player-props ${name} failed::See that step's log. A silent \
          failure here stops player_tips.csv and player_history.parquet from advancing."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
