name: Player Props

on:
  schedule:
    # Predict-only: 5x daily (30 min after main predict runs)
    - cron: '30 6,10,14,18,22 * * *'
    # WC retrain: nightly at 23:30 UTC (after all WC matches finish)
    - cron: '30 23 * * *'
    # Full club-league retrain: every Sunday at 05:00 UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'predict'
        type: choice
        options: [predict, collect_train_predict]

jobs:
  player_props:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect club league data (Sundays + manual)
        if: |
          github.event.schedule == '0 5 * * 0' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect_train_predict')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode collect
        continue-on-error: true

      - name: Collect WC2026 national team data (nightly during WC, Sundays, manual)
        if: |
          github.event.schedule == '30 23 * * *' ||
          github.event.schedule == '0 5 * * 0' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect_train_predict')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          if [ "$TODAY" -ge "20260611" ] && [ "$TODAY" -le "20260726" ]; then
            echo "WC2026 active — collecting national team data..."
            python -m player_model.pipeline --mode collect-wc --last-n 10
          else
            echo "Outside WC2026 window ($TODAY), skipping collect-wc."
          fi
        continue-on-error: true

      - name: Train player models (nightly during WC, Sundays, manual)
        if: |
          github.event.schedule == '30 23 * * *' ||
          github.event.schedule == '0 5 * * 0' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'collect_train_predict')
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          if [ "$TODAY" -ge "20260611" ] && [ "$TODAY" -le "20260726" ]; then
            python -m player_model.pipeline --mode train
          else
            # Outside WC — only train on Sundays
            if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              python -m player_model.pipeline --mode train
            else
              echo "Outside WC2026 window, skipping nightly train."
            fi
          fi
        continue-on-error: true

      - name: Generate player prop predictions
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m player_model.pipeline --mode predict
        continue-on-error: true

      - name: Send Telegram alerts for player prop signals
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from telegram_bot.notifier import notify_player_props
          sent = notify_player_props()
          print(f'Player prop alerts sent: {sent}')
          "
        continue-on-error: true

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/player_tips.csv telegram_bot/notified.json \
                     player_history.parquet \
                     models/model_player_goals.pkl models/model_player_assists.pkl \
                     models/model_player_sot.pkl models/model_player_cards.pkl 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: player props $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
