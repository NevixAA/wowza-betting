name: Injury Refresh

# Daily sidelined/injury crawl, split out of player_props.yml so the hourly
# predict workflow stays fast. The /sidelined endpoint is ~3,600-6,300 players
# behind a global 0.15s rate-lock (~10-16 min) — far too slow to run hourly.
# Injuries/chronic-risk move slowly, so once a day is plenty; hourly predicts
# reuse the injury features already written into player_history.parquet.

concurrency:
  group: injury-refresh
  cancel-in-progress: false

on:
  schedule:
    # WEEKLY, Tuesday 04:00 UTC (was daily — changed 2026-08-16).
    #
    # This step is by far the biggest consumer of the 7,500/day API-Football quota: the
    # usage curve shows it burning ~6,545 calls between 04:05 and 04:56, i.e. 87% of the
    # entire day, every day, before 05:00. It starved everything downstream — the Sunday
    # 05:00 club collect, the hourly props predict (whose fixture gate then saw an empty
    # API and disabled itself), and the odds captures.
    #
    # It is also unnecessary at that cadence. --mode enrich-sidelined-live computes
    # chronic_injury_risk, days_since_last_injury and return_from_injury_flag, all derived
    # from a ROLLING 365-DAY window. Those move imperceptibly day to day; a week of
    # staleness is irrelevant to a year-long aggregate.
    #
    # Tuesday because it is the quietest fixture day — the crawl no longer competes with a
    # Saturday/Sunday matchday slate for quota.
    - cron: '0 4 * * 2'
  workflow_dispatch:

jobs:
  injury_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache player injury/sidelined data (30-day TTL)
        uses: actions/cache@v4
        with:
          path: player_match_cache
          key: player-match-${{ runner.os }}-${{ github.run_id }}
          restore-keys: player-match-${{ runner.os }}-

      - name: Refresh injury status (sidelined crawl for active prop-league players)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode enrich-sidelined-live

      - name: Commit and push updated parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f player_history.parquet 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: injury refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
