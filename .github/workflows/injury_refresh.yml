name: Injury Refresh

# Daily sidelined/injury crawl, split out of player_props.yml so the hourly
# predict workflow stays fast. The /sidelined endpoint is ~3,600-6,300 players
# behind a global 0.15s rate-lock (~10-16 min) — far too slow to run hourly.
# Injuries/chronic-risk move slowly, so once a day is plenty; hourly predicts
# reuse the injury features already written into player_history.parquet.

# SHARED with player_history_extend.yml (2026-10-26): the two scheduled writers of
# player_history.parquet run one at a time, and `ref: main` below makes a run that waited in
# the queue start from the commit the other one pushed. On 2026-10-24 they committed 42 s
# apart from stale checkouts and the rebase let one copy of a month part overwrite the other
# (764 rows lost until the next collect). See the comment in player_history_extend.yml.
concurrency:
  group: player-history-writer
  cancel-in-progress: false

on:
  schedule:
    # Daily 04:00 UTC. Briefly moved to weekly on 2026-08-16 because this crawl was eating
    # ~6,545 calls — 87% of the old 7,500/day cap — before 05:00, starving the Sunday club
    # collect, the props fixture gate and the odds captures. The quota is now 75,000/day, so
    # the same crawl is ~9% and daily freshness is affordable again.
    #
    # The max_players rail in mode_enrich_sidelined_live stays as a safety net: /sidelined is
    # per-player with no bulk endpoint, so an unbounded crawl is exactly the shape of problem
    # that caused the outage. It is now set high enough not to bite in normal operation.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  injury_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main      # never the queued trigger SHA -- see the concurrency comment above

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache player injury/sidelined data (30-day TTL)
        uses: actions/cache@v4
        with:
          path: player_match_cache
          key: player-match-${{ runner.os }}-${{ github.run_id }}
          restore-keys: player-match-${{ runner.os }}-

      - name: Refresh injury status (sidelined crawl for active prop-league players)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m player_model.pipeline --mode enrich-sidelined-live

      # Commit the 59MB parquet WEEKLY, not daily.
      #
      # UPDATE 2026-10-26: the churn described below is gone at its source. The refresh now
      # writes each row AS OF ITS MATCH DATE and only rows from the last 60 days
      # (history_integrity.INJURY_REFRESH_WINDOW_DAYS); a point-in-time value does not drift
      # with the calendar, so a refresh changes only rows the collect added since the last one
      # (NaN -> value) plus genuine corrections, i.e. the newest one or two month parts. The
      # "today"-stamped value it used to write onto every historical row was a FEATURE LEAK
      # (a 2023 row knew about 2026 injuries), not just a storage cost. Saturday-only stays:
      # those parts are rewritten by the daily collect anyway, so committing daily would
      # roughly double their churn for a few days of freshness on NaN-until-Saturday rows.
      #
      # Measured 2026-08-18: this workflow committed player_history.parquet every day, and the
      # file content changed by 6-198 BYTES each time — yet parquet is a binary container git
      # cannot delta-compress, so every commit stored a fresh 58.78 MB blob. 96 commits had
      # accumulated ~2,785 MB of blob history, ~59 MB/day, and .git had reached 1,299 MB.
      # GitHub had begun showing "Cannot retrieve latest commit at this time".
      #
      # Where that churn comes from, per 24h across 230,216 rows:
      #     days_since_last_injury   36,525 rows changed (15.87%)
      #     chronic_injury_risk          94 rows changed (0.041%)
      #     return_from_injury_flag       0 rows changed
      #
      # So almost all of it is days_since_last_injury, which is a pure function of
      # (last injury date, today) — a derived day counter, not an observation. Storing it
      # per-row and rewriting the whole file daily is the wrong trade. The right fix is to
      # keep a small last-injury-date table and compute the delta at read time, but that
      # changes how a MODEL FEATURE is derived and belongs behind validation, not in a
      # storage cleanup.
      #
      # Committing on SATURDAY is the safe interim: the enrichment still runs daily (keeping
      # the API cache warm and surfacing failures), chronic_injury_risk's ~660 weekly row
      # changes are still captured, and Sunday 03:00 retrain reads a parquet refreshed hours
      # earlier. The only cost is that days_since_last_injury can be up to 6 days stale, which
      # on a counter usually measured in tens-to-hundreds of days is a small relative error.
      # Saves roughly 51 MB/day of repository growth.
      - name: Commit and push updated parquet (Saturdays only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DOW=$(date -u +%u)   # 1=Mon .. 6=Sat, 7=Sun
          if [ "$DOW" != "6" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Day $DOW — enrichment ran, but the 59MB parquet is only committed on"
            echo "Saturdays (and on manual dispatch). Skipping commit; nothing is lost that"
            echo "the next Saturday run will not re-derive."
            exit 0
          fi
          # -A: player_history.parquet is a DIRECTORY of month parts; a part that appears or
          # disappears must be staged as an add or a deletion. Directory-scoped, never repo-wide.
          git add -A -f player_history.parquet 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: injury refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            if git pull --rebase --autostash -X theirs origin main; then
              # Tripwire: never push a history that lacks a row origin already has.
              python -m player_model.history_integrity guard origin/main || {
                echo "::error title=history guard::push would drop committed player_history rows - not pushed"
                exit 1; }
              git push && { pushed=1; break; }
            fi
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
