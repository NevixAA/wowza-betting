name: Weekly Retrain

on:
  schedule:
    - cron: '0 3 * * 0'   # Every Sunday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: retrain
  cancel-in-progress: false

# SCOPE (2026-08-02): this job trains ONLY the main match models
# (standard + newformat + HT + side markets). It is intentionally lean:
#   - Player props (collect + train + calibration) are owned by player_props.yml,
#     which has the fixture/player caches and runs Sunday 05:00 (2h after this) + WC
#     nightly. Training them here too ran COLD (no caches) and blew the 2h cap.
#   - The heavy walk-forward backtest + league ROI config are owned by backtest_matrix.yml
#     (parallel, monthly). Doing it here was the original cause of the 2h timeout.

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Main match models (standard + newformat + HT + side markets) ────────────
      - name: Train main models
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # Full xG/inside-box enrichment: weekly job, no tip deadline. Predict leaves this unset.
          WOWZA_FULL_ENRICH: '1'
        run: python pipeline.py --mode train
        continue-on-error: false

      # ── Commit updated main models ──────────────────────────────────────────────
      - name: Commit updated main models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # PER-FILE, because `git add -f a b missing` ABORTS and stages NOTHING — one absent
          # path loses the whole list, and the `2>/dev/null || true` that used to wrap this
          # swallowed both the abort and the error, so the job went green having persisted
          # nothing. Verified in a scratch repo: `git add -f a.txt missing.txt` leaves the index
          # empty; `git add -f a.txt` alone stages a.txt. This is the same defect that silenced
          # player_props for three days and it was still here.
          #
          # output/backtest_metrics_history.json IS THE LEARNING RECORD and was never staged.
          # retrain.py's `_save_metrics()` wrote it on the runner and the runner took it away, so
          # the file in git has been frozen at 2026-06-17 while every run compared itself to that
          # June snapshot. The promotion gate added in retrain.py reads this file to decide
          # whether a new model regressed — without it committed, the gate has no memory and
          # week-to-week improvement cannot be measured at all. Same failure shape as the FPL
          # cache sidecar.
          for f in models/model_v9_standard.pkl models/model_v9_newformat.pkl \
                   models/model_v9_btts.pkl models/model_v9_over15.pkl models/model_v9_over35.pkl \
                   models/model_ht_over05.pkl models/model_ht_over15.pkl \
                   models/metrics_model_v9_standard.json models/metrics_model_v9_newformat.json \
                   models/metrics_model_v9_btts.json models/metrics_model_v9_over15.json \
                   models/metrics_model_v9_over35.json \
                   models/metrics_model_ht_over05.json models/metrics_model_ht_over15.json \
                   models/best_params_btts.json models/best_params_over15.json \
                   models/best_params_over35.json \
                   models/feature_importances_btts.csv models/feature_importances_over15.csv \
                   models/feature_importances_over35.csv \
                   models/feature_importances_ht_over05.csv \
                   models/feature_importances_ht_over15.csv \
                   models/feature_importances_standard.csv \
                   models/feature_importances_newformat.csv \
                   output/backtest_metrics_history.json \
                   output/backtest_results_standard.csv output/backtest_by_league_standard.csv \
                   output/backtest_results_newformat.csv output/backtest_by_league_newformat.csv; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: weekly main-model retrain $(date -u '+%Y-%m-%d')"
          pushed=0
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
