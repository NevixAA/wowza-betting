name: Retrain Models

on:
  schedule:
    - cron: '0 4 * * 0'   # Every Sunday at 04:00 UTC (before the week starts)
  workflow_dispatch:        # Allow manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain models (downloads fresh data from football-data.co.uk)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline.py --mode train

      - name: Commit and push updated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add models/model_v9_standard.pkl models/model_v9_newformat.pkl \
                  models/model_ht_over05.pkl models/model_ht_over15.pkl \
                  models/feature_importances_standard.csv models/feature_importances_newformat.csv
          git diff --staged --quiet || \
            git commit -m "auto: retrain models $(date -u '+%Y-%m-%d')"
          git push
