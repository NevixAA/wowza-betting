name: Retrain (daily to 2026-10-05, weekly after)

on:
  schedule:
    # DAILY until 2026-10-05, then automatically back to Sundays only. The cron fires every day
    # and the guard step below decides; it expires by DATE so nobody has to remember to change
    # it back, and forgetting is the failure mode that actually happens.
    #
    # Requested 2026-09-22: "on the upcoming 3 weeks (until oct 5) i want daily retrain" and
    # "they must retrain any week". Weekly is the floor after the burst.
    #
    # Worth knowing what daily buys and what it does not. Retraining adds information only when
    # new SETTLED results arrive, and those land at the rate fixtures finish — roughly 40-60 a
    # week across our leagues. A daily run therefore re-fits on about 1% more data than the day
    # before, so most of the day-to-day movement in the backtest is fitting noise rather than
    # learning. That is exactly why the promotion gate in retrain.py holds its bar at the BEST
    # of the last 6 runs instead of yesterday: without that, daily retraining can walk the model
    # down a tolerance-sized step at a time, every step passing on its own.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: retrain
  cancel-in-progress: false

# SCOPE (2026-08-02): this job trains ONLY the main match models
# (standard + newformat + HT + side markets). It is intentionally lean:
#   - Player props (collect + train + calibration) are owned by player_props.yml,
#     which has the fixture/player caches and runs Sunday 05:00 (2h after this) + WC
#     nightly. Training them here too ran COLD (no caches) and blew the 2h cap.
#   - The heavy walk-forward backtest + league ROI config are owned by backtest_matrix.yml
#     (parallel, monthly). Doing it here was the original cause of the 2h timeout.

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 120 -> 240 for the COLD run. The cache added below only helps once something has populated
    # it, and the first run after 2026-09-06's full-enrichment switch has to fetch all 46 leagues
    # from scratch. If that run hits the cap it is killed, the cache never gets written, and the
    # next run is cold again — a deadlock with exactly the shape of the FPL sidecar bug, where
    # the fetch that would have written the state was the one being skipped.
    #
    # Steady state should be far under this: TTLs are hours to days, so a warm run re-fetches
    # only what expired. If runs settle well below 120 minutes this can come back down.
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Daily through 2026-10-05, Sundays after. Runs before any setup so a skipped day costs
      # seconds. A manual workflow_dispatch always runs, whatever the date.
      - name: Retrain today?
        id: gate
        run: |
          TODAY=$(date -u +%F)
          DOW=$(date -u +%u)          # 1=Mon .. 7=Sun
          UNTIL="2026-10-05"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "manual dispatch — running"
          elif [ "$TODAY" \< "$UNTIL" ] || [ "$TODAY" = "$UNTIL" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY is within the daily window (through $UNTIL) — running"
          elif [ "$DOW" = "7" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$TODAY is a Sunday and the daily window has expired — running weekly"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$TODAY is past $UNTIL and not a Sunday — skipping (weekly cadence resumed)"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      # THE MISSING PIECE, and the reason the models have not retrained since 2026-08-30.
      #
      # On 2026-09-06, d4a29b58 set WOWZA_FULL_ENRICH: '1' on the train step below. That flips
      # src/data_loader from enriching the 15 new-format leagues to enriching EVERY league with
      # an API-Football id — 46 of them, a 3.1x increase — across every season in the training
      # frame. This workflow had no actions/cache step, so each run started COLD and refetched
      # all of it against a 120-minute cap. No retrain has committed since.
      #
      # This is the SAME mistake CLAUDE.md already documents from 2026-08-15, in a different
      # workflow: "Wiring APIFOOTBALL_KEY into predict.yml switched on eight API-Football
      # enrichments... predict.yml has no actions/cache step, so every 5-minute run refetched
      # from cold: runtime went 2-3 min -> 10+ against a 15-minute timeout. Reverted.
      # Re-enabling requires caching api_football_cache/ first." predict.yml got its cache on
      # 2026-09-06. retrain.yml got the enrichment switch on the same day and not the cache.
      #
      # Same paths and the same key strategy as predict.yml: a per-run key so each run writes a
      # fresh entry, and a restore-key prefix so it starts from the most recent one. TTLs are
      # hours to days, so a warm cache makes the steady-state cost a fraction of a cold run —
      # which matters far more now that this job runs DAILY to 2026-10-05.
      - name: Cache API-Football responses (makes full enrichment affordable)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            api_football_cache
            apifootball_ou_cache
          key: af-cache-retrain-${{ github.run_id }}
          restore-keys: af-cache-retrain-

      # ── Main match models (standard + newformat + HT + side markets) ────────────
      - name: Train main models
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          # Full xG/inside-box enrichment: weekly job, no tip deadline. Predict leaves this unset.
          WOWZA_FULL_ENRICH: '1'
        run: python pipeline.py --mode train
        continue-on-error: false

      # Tell Nevo whether the models actually got better. Requested 2026-09-22. Reads
      # output/retrain_log.json, which _train_one writes per model with the gate decision and
      # the held-out log loss before and after. Deduped on RETRAIN|<date> in notified.json, so
      # the daily cadence cannot double-send.
      - name: Send retrain result
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import sys; sys.path.insert(0,'.')
          from telegram_bot.notifier import notify_retrain_result
          print('retrain digest:', 'sent' if notify_retrain_result() else 'skipped')
          "
        continue-on-error: true

      # ── Commit updated main models ──────────────────────────────────────────────
      - name: Commit updated main models
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # PER-FILE, because `git add -f a b missing` ABORTS and stages NOTHING — one absent
          # path loses the whole list, and the `2>/dev/null || true` that used to wrap this
          # swallowed both the abort and the error, so the job went green having persisted
          # nothing. Verified in a scratch repo: `git add -f a.txt missing.txt` leaves the index
          # empty; `git add -f a.txt` alone stages a.txt. This is the same defect that silenced
          # player_props for three days and it was still here.
          #
          # THE TWO DATA BANKS, and neither was staged until 2026-09-22. Both are written on the
          # runner and both were destroyed with it, so neither could ever accumulate:
          #
          #   output/fd_history.parquet  — the football-data history cache. The run on
          #     2026-09-22 grew it 37,623 -> 58,156 rows and that growth would have been thrown
          #     away, leaving the next run to re-download the same finished seasons.
          #   output/af_history.parquet  — the shot/xG bank that data_loader now writes back
          #     after enrichment. Unstaged it is pointless: the whole purpose is that the NEXT
          #     run merges these rows instead of spending two hours re-fetching them.
          #
          # Both hold data about FINISHED matches, which cannot change, so they only grow when
          # genuinely new fixtures settle — `git diff --staged --quiet` below means an unchanged
          # file costs no commit. The alternative is paying for immutable history every run,
          # forever, which is what has been happening.
          #
          # output/backtest_metrics_history.json IS THE LEARNING RECORD and was never staged.
          # retrain.py's `_save_metrics()` wrote it on the runner and the runner took it away, so
          # the file in git has been frozen at 2026-06-17 while every run compared itself to that
          # June snapshot. The promotion gate added in retrain.py reads this file to decide
          # whether a new model regressed — without it committed, the gate has no memory and
          # week-to-week improvement cannot be measured at all. Same failure shape as the FPL
          # cache sidecar.
          for f in models/model_v9_standard.pkl models/model_v9_newformat.pkl \
                   models/model_v9_btts.pkl models/model_v9_over15.pkl models/model_v9_over35.pkl \
                   models/model_ht_over05.pkl models/model_ht_over15.pkl \
                   models/metrics_model_v9_standard.json models/metrics_model_v9_newformat.json \
                   models/metrics_model_v9_btts.json models/metrics_model_v9_over15.json \
                   models/metrics_model_v9_over35.json \
                   models/metrics_model_ht_over05.json models/metrics_model_ht_over15.json \
                   models/best_params_btts.json models/best_params_over15.json \
                   models/best_params_over35.json \
                   models/feature_importances_btts.csv models/feature_importances_over15.csv \
                   models/feature_importances_over35.csv \
                   models/feature_importances_ht_over05.csv \
                   models/feature_importances_ht_over15.csv \
                   models/feature_importances_standard.csv \
                   models/feature_importances_newformat.csv \
                   output/backtest_metrics_history.json \
                   output/retrain_log.json \
                   telegram_bot/notified.json \
                   output/fd_history.parquet \
                   output/af_history.parquet \
                   output/backtest_results_standard.csv output/backtest_by_league_standard.csv \
                   output/backtest_results_newformat.csv output/backtest_by_league_newformat.csv; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: main-model retrain $(date -u '+%Y-%m-%d')"
          pushed=0
          for i in 1 2 3 4 5; do
            # `-X ours` -> `-X theirs`. In a REBASE the labels are inverted from a merge:
            # `ours` is UPSTREAM and `theirs` is the commit being replayed, i.e. THIS run.
            # `-X ours` therefore resolved every conflict in favour of what was already on
            # origin and silently threw away the rows this run had just fetched, while still
            # reporting success -- exactly how af_history.parquet went 18 days without moving.
            # `-X theirs` keeps this run's data and still never fails the pull, so nothing is
            # lost and no job starts going red.
            git pull --rebase --autostash -X theirs origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
