name: Live Scanner

# DISABLED 2026-08-03: in-play / live-betting alerts are a SEPARATE product, not part of the
# pre-match O/U/BTTS/props strategy. Was auto-running ~190x/day (every 5 min) + draining OddsAPI.
# Schedule commented out so it no longer auto-runs; kept as workflow_dispatch to re-enable later.
on:
  # schedule:
  #   - cron: '3-59/5 8-23 * * *'   # (disabled — re-enable by uncommenting)
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/live_scanner.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/live_tips.csv output/live_games.csv \
                     output/live_signals_history.csv \
                     telegram_bot/live_notified.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: live $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
