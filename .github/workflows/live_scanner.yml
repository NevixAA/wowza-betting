name: Live Scanner

on:
  schedule:
    # Every 30 minutes during match hours (11:00-23:30 UTC)
    - cron: '*/30 11-23 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/live_scanner.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add output/live_tips.csv output/live_games.csv \
                  output/live_signals_history.csv \
                  telegram_bot/live_notified.json || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: live $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
