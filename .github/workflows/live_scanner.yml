name: Live Scanner

# REACTIVATED 2026-08-05 as the v2 in-play COLLECTOR + improved live-lambda alerter:
#   - live-adjusted lambda from in-play SOT (SOT->goal 0.311) + game state, not flat time-decay
#   - logs an in-play snapshot every scan (output/inplay_snapshots.csv) -> the Phase-1 dataset
#     that a FITTED live model needs; grade with `python src/live_scanner.py --grade`
# Cadence 5->10 min to respect the API-Football budget (internal throttle + 90s stats cache also
# bound cost). Isolated outputs; degrades to the old naive lambda if live SOT is unavailable.
on:
  schedule:
    - cron: '3-59/10 8-23 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/live_scanner.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/live_tips.csv output/live_games.csv \
                     output/live_signals_history.csv output/inplay_snapshots.csv \
                     telegram_bot/live_notified.json 2>/dev/null || true
          git diff --staged --quiet || \
            git commit -m "auto: live $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X ours origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
