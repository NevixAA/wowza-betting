name: Live Scanner

# REACTIVATED 2026-08-05 as the v2 in-play COLLECTOR + improved live-lambda alerter:
#   - live-adjusted lambda from in-play SOT (SOT->goal 0.311) + game state, not flat time-decay
#   - logs an in-play snapshot every scan (output/inplay_snapshots.csv) -> the Phase-1 dataset
#     that a FITTED live model needs; grade with `python src/live_scanner.py --grade`
# Cadence 5->10 min to respect the API-Football budget (internal throttle + 90s stats cache also
# bound cost). Isolated outputs; degrades to the old naive lambda if live SOT is unavailable.
on:
  schedule:
    # Every 5 minutes during match hours (was 10 — changed 2026-08-16 after the quota went
    # to 75,000/day). 5 is GitHub's floor: Actions will not schedule more often than that,
    # so anything finer is silently throttled and only makes the cron a lie.
    #
    # The cadence was 10 to respect the old 7,500 budget, but a scan is ONE
    # /fixtures?live=all call plus per-live-game stats — ~180 runs/day is a few hundred calls.
    #
    # The point is the DATASET. output/inplay_snapshots.csv is the Phase-1 collection a
    # fitted live model needs and it holds 128 rows; doubling the scan rate is the cheapest
    # way to grow it, and it also tightens the in-play signals themselves (a goal is picked
    # up within 5 minutes instead of 10).
    - cron: '1-59/5 8-23 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live scanner
        env:
          # APIFOOTBALL_KEY is REQUIRED: without it _fetch_live_scores falls back to OddsAPI
          # /scores, which has DELAYED scores + an APPROXIMATED clock -> wrong live state
          # (e.g. "0-0 at 72'" when it was really 3-1). API-Football gives real score + elapsed.
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/live_scanner.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # PER-FILE. `git add -f a b missing` ABORTS and stages NOTHING — one absent path loses
          # the whole list and `|| true` then hides it. All five paths happen to exist today, so
          # this is a latent trap rather than an active one, but it is the same defect that
          # silenced player_props for three days and inplay_snapshots.csv is created lazily.
          for f in output/live_tips.csv output/live_games.csv \
                   output/live_signals_history.csv output/inplay_snapshots.csv \
                   telegram_bot/live_notified.json; do
            git add -f "$f" 2>/dev/null || echo "  (skip, not present: $f)"
          done
          echo "staged: $(git diff --staged --name-only | wc -l) file(s)"
          git diff --staged --quiet || \
            git commit -m "auto: live $(date -u '+%Y-%m-%d %H:%M UTC')"
          pushed=0
          for i in 1 2 3 4 5; do
            # No `-X ours`: during a REBASE `ours` is UPSTREAM, so it resolves every conflict in
            # favour of whoever pushed first and discards THIS run's rows. inplay_snapshots.csv
            # and live_signals_history.csv are append-only records of a moment that cannot be
            # re-observed — an in-play state at 63' is gone once the match moves on.
            git pull --rebase --autostash origin main && git push && { pushed=1; break; }
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          [ "$pushed" = "1" ] || { echo "push failed after 5 retries"; exit 1; }
